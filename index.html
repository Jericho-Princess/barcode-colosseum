<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#3b2f2f;color:#f5f5f5;text-align:center;text-shadow:0 0 5px black;}
.panel{background:rgba(0,0,0,0.5);padding:15px;margin:10px;border-radius:15px;font-size:18px;}
#turn{font-size:32px;margin:10px 0;}
.char{border:5px solid #999;border-radius:15px;padding:10px;margin:10px;display:inline-block;width:140px;height:320px;box-sizing:border-box;}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 15px gold;}
.hpWrap{background:#222;height:15px;}
.hpNow{background:lime;height:15px;transition:width 0.5s;}
#skills{margin-left:20px;}
#effect{position:fixed;top:30%;left:50%;transform:translate(-50%,0);font-size:28px;background:rgba(0,0,0,0.8);padding:20px;border-radius:15px;}
.skillBtn{margin:10px;padding:15px 25px;font-size:20px;border-radius:10px;}
button,input{font-size:18px;padding:10px;margin:5px;border-radius:10px;}
</style>
</head>
<body>

<h1>バーコードコロシアム</h1>

<div id="title" class="panel">
<button onclick="startPVP()">プレイヤー対戦</button><br><br>
<button onclick="startCPU()">CPU対戦</button>
</div>

<div id="game" style="display:none;">
<div class="panel">
<input id="barcodeInput" placeholder="バーコード">
<button onclick="manualInput()">召喚</button>
<button onclick="randomGen()">ランダム</button>
</div>

<div id="turn"></div>
<div id="chars"></div>
<div id="skills"></div>
<button id="startBattleBtn" style="display:none;" onclick="startBattle()">開始</button>
</div>

<script>
let characters=[], current=0, gameMode="pvp";
let battleStarted=false, waitingForCPU=false;

function gen(){
  return {
    name:"モンスター",
    hp:300,maxHp:300,
    atk:40,def:20,
    status:null,
    skills:[
      {name:"攻撃",power:1},
      {name:"電撃",power:1.2,status:"paralyze",statusRate:0.3}
    ]
  };
}

function addChar(){
  if(characters.length>=2)return;
  characters.push(gen());
  render();
  if(characters.length==2) startBattleBtn.style.display="block";
}

function manualInput(){addChar();}
function randomGen(){addChar();}

function startBattle(){
  battleStarted=true;
  current=0;
  updateTurn();
  showSkills();
}

function updateTurn(){
  turn.innerText=(current==0?"1P":"2P")+" のターン";
}

function showSkills(){
  let c=characters[current];
  skills.innerHTML="";
  c.skills.forEach((s,i)=>{
    skills.innerHTML+=`<button onclick="useSkill(${i})">${s.name}</button>`;
  });
}

function render(){
  chars.innerHTML="";
  characters.forEach(c=>{
    chars.innerHTML+=`HP:${c.hp}<br>状態:${c.status||"正常"}<br><br>`;
  });
}

function showEffect(msg,cb){
  let e=document.createElement("div");
  e.id="effect";
  e.innerHTML=msg+"<br>クリック";
  e.onclick=()=>{e.remove();if(cb)cb();}
  document.body.appendChild(e);
}

function useSkill(i){
  if(waitingForCPU)return;
  let a=characters[current],d=characters[1-current],s=a.skills[i];
  waitingForCPU=true;

  let msg=s.name;

  // 状態異常
  if(s.status && Math.random()<s.statusRate){
    d.status=s.status;
    msg+=" → 麻痺になった";
  }

  // ダメージ（←電撃でも入る）
  let dmg=(a.atk-d.def/2)*s.power;
  d.hp-=dmg;

  render();

  showEffect(msg,()=>{
    if(d.hp<=0){alert("勝利");return;}
    waitingForCPU=false;
    nextTurn();
  });
}

function nextTurn(){
  current=1-current;
  let c=characters[current];

  // 麻痺スキップ（完全スキップ）
  if(c.status==="paralyze"){
    showEffect("麻痺で行動不能",()=>{
      c.status=null;
      render();
      nextTurn(); // ★ここが最重要
    });
    return;
  }

  updateTurn();
  showSkills();
}
</script>
</body>
</html>
