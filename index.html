<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  color:#f5f5f5;
  background:#3b2f2f;
  text-shadow:0 0 5px black;
  margin:0; padding:0;
}

.panel{
  background:rgba(0,0,0,0.5);
  padding:15px;
  margin:10px;
  border-radius:15px;
  font-size:18px;
}

#turn{
  font-size:32px;
  margin:10px 0;
}

.char{
  border:5px solid #999;
  border-radius:15px;
  padding:10px;
  margin:10px;
}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 15px gold;}

.hpWrap{background:#222;height:15px;position:relative;}
.hpNow{background:lime;height:15px;}
.hpLost{background:red;height:15px;position:absolute;right:0;}

#gameContent{display:flex;flex-direction:column;align-items:center;}
#charsAndSkills{display:flex;flex-direction:row;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
.char{margin:5px;}
#skills{margin-left:20px;}

#effect{
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,0);
  font-size:48px;
  z-index:999;
}

.skillBtn{
  margin:10px;
  padding:15px 25px;
  font-size:20px;
  border-radius:10px;
}

button{
  font-size:20px;
  padding:15px 25px;
  margin:5px;
  border-radius:10px;
}
input{
  font-size:18px;
  padding:10px;
  margin:5px;
  border-radius:10px;
}
</style>
</head>
<body>

<h1>バーコードコロシアム</h1>

<div id="title" class="panel">
  <button onclick="startPVP()">プレイヤー対戦</button><br><br>
  <button onclick="startCPU()">CPU対戦</button><br><br>
  <button onclick="showOptions()">オプション</button>
</div>

<div id="options" class="panel" style="display:none;">
  プレイヤー1: <input id="player1Name" placeholder="1P"><br><br>
  プレイヤー2: <input id="player2Name" placeholder="2P"><br><br>
  <button onclick="closeOptions()">閉じる</button>
</div>

<div id="game" style="display:none;">
  <button onclick="goTitle()">← タイトルに戻る</button><br><br>

  <div class="panel">
    バーコード入力: <input id="barcodeInput" placeholder="バーコード入力">
    <button onclick="manualInput()">召喚</button><br><br>
    <button onclick="randomGen()">ランダム召喚</button>
    <button onclick="scan()">スキャン召喚</button>
  </div>

  <div id="reader"></div>

  <div id="gameContent">
    <div id="turn" class="panel"></div>
    <div id="charsAndSkills">
      <div id="chars"></div>
      <div id="skills" class="panel"></div>
    </div>
    <button id="startBattleBtn" style="display:none;" onclick="startBattle()">バトル開始</button>
  </div>

  <div id="result" class="panel"></div>
</div>

<script>
let characters=[], current=0, gameMode="pvp";

/* 画像リスト */
const charImages={
  common:["img/c1.png","img/c2.png","img/c3.png","img/c4.png","img/c5.png","img/c6.png","img/c7.png","img/c8.png","img/c9.png","img/c10.png","img/c11.png","img/c12.png"],
  rare:["img/r1.png","img/r2.png","img/r3.png","img/r4.png","img/r5.png"],
  ssr:["img/s1.png","img/s2.png","img/s3.png"]
};

/* 技割り当て */
function assignSkills(rarity="common"){
  let skills=[{name:"攻撃", power:1, miss:0.05}];
  let skillPool = [
    {name:"強打", power:1.8, miss:0.25},
    {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, miss:0.05},
    {name:"憤怒", power:0, miss:0, buff:"atkUp"},
    {name:"鉄壁", power:0, miss:0, buff:"defUp"},
    {name:"再生", power:0, miss:0, buff:"heal"},
    {name:"疫病", power:0, miss:0, debuff:"down"},
    {name:"特攻", power:2.5, miss:0.1, recoil:true}
  ];
  skillPool.sort(()=>0.5-Math.random());
  skills.push(skillPool[0]);
  skills.push(skillPool[1]);
  if(rarity=="ssr") skills.push({name:"奥義", power:3, miss:0.2});
  return skills;
}

/* キャラクター生成（バーコード固定性能） */
function gen(code=""){
  let hash=code ? code.split("").reduce((a,b)=>a+b.charCodeAt(0),0) : Math.floor(Math.random()*10000);
  let r=Math.random();
  let rarity="common";
  if(r<0.04) rarity="ssr";
  else if(r<0.24) rarity="rare";
  let imgs = charImages[rarity];
  let sprite = imgs[hash % imgs.length];

  let atk=40, def=20, hp=300; // HP増加
  if(rarity=="rare"){ atk*=1.12; def*=1.12; hp*=1.12; }
  if(rarity=="ssr"){ atk*=1.3; def*=1.3; hp*=1.3; }

  return {name:"モンスター", rarity, sprite, hp, maxHp:hp, atk, def, skills:assignSkills(rarity)};
}

/* 召喚 */
function manualInput(){
  let code = document.getElementById("barcodeInput").value;
  if(!code){ alert("バーコードを入力してください"); return; }
  addChar(code);
}
function randomGen(){addChar();}
function scan(){
  let s=new Html5Qrcode("reader");
  s.start({facingMode:"environment"},{fps:10,qrbox:250},
    txt=>{ addChar(txt); s.stop(); });
}

function addChar(code=""){
  if(characters.length>=2){ alert("キャラクターは最大2体"); return; }
  characters.push(gen(code));
  render();
  if(characters.length>=2) startBattleBtn.style.display="inline-block";
}

/* 戦闘開始 */
function startBattle(){
  startBattleBtn.style.display="none";
  current=0;
  updateTurn();
  showSkills();
}

/* ターン更新 */
function updateTurn(){ turn.innerText=(current==0?"1P":"2P")+" のターン"; }

/* 技表示 */
function showSkills(){
  let c=characters[current], html="";
  c.skills.forEach((s,i)=>html+=`<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`);
  skills.innerHTML=html;
}

/* 技使用 */
function useSkill(i){
  let a=characters[current], d=characters[1-current], s=a.skills[i];
  showSkillName(s.name);

  if(Math.random()<s.miss){ showResult("Miss"); next(); return; }

  let dmg=(a.atk-d.def/2)*s.power;
  d.hp-=dmg; if(d.hp<0)d.hp=0;

  if(s.buff=="atkUp") a.atk*=1.15;
  if(s.buff=="defUp") a.def*=1.15;
  if(s.buff=="heal"){ a.hp+=50; if(a.hp>a.maxHp) a.hp=a.maxHp; }
  if(s.debuff=="down"){ d.atk*=0.9; d.def*=0.9; }

  render();
  showResult("Hit");

  if(d.hp<=0){ result.innerHTML=(current==0?"1P":"2P")+" 勝利！<br><button onclick='rematch()'>再戦</button>"; return; }

  next();
}

/* 次ターン */
function next(){
  current=1-current; updateTurn(); showSkills();
  if(gameMode=="cpu" && current==1){
    setTimeout(()=>{ let r=Math.floor(Math.random()*characters[1].skills.length); useSkill(r); },600);
  }
}

/* キャラクター描画 */
function render(){
  let html="";
  characters.forEach(c=>{
    let hpP=c.hp/c.maxHp*100;
    html+=`<div class="char ${c.rarity}">
      <img src="${c.sprite}" width=100><br>
      ❤️ ${Math.floor(c.hp)} / ${Math.floor(c.maxHp)}<br>
      ⚔️ ${Math.floor(c.atk)}<br>
      🛡 ${Math.floor(c.def)}<br>
      <div class="hpWrap"><div class="hpNow" style="width:${hpP}%"></div><div class="hpLost" style="width:${100-hpP}%"></div></div>
    </div>`;
  });
  chars.innerHTML=html;
}

/* 技名表示 */
function showSkillName(name){
  let e=document.createElement("div"); e.id="effect"; e.innerText=name;
  document.body.appendChild(e); setTimeout(()=>e.remove(),500);
}

/* Hit/Miss 表示 */
function showResult(text){
  let e=document.createElement("div"); e.id="effect"; e.style.top="50%"; e.innerText=text;
  document.body.appendChild(e); setTimeout(()=>e.remove(),500);
}

/* タイトルに戻る */
function goTitle(){
  game.style.display="none"; title.style.display="block";
  characters=[]; current=0; result.innerText=""; chars.innerHTML=""; skills.innerHTML=""; startBattleBtn.style.display="none";
}

/* 再戦 */
function rematch(){
  characters.forEach(c=>{ c.hp=c.maxHp; });
  current=0; result.innerText=""; render(); updateTurn(); showSkills();
  if(gameMode=="cpu" && characters.length==2 && current==1){ setTimeout(()=>{ useSkill(Math.floor(Math.random()*characters[1].skills.length)); },600); }
}

/* モード切替 */
function startPVP(){ gameMode="pvp"; title.style.display="none"; game.style.display="block"; }
function startCPU(){ gameMode="cpu"; title.style.display="none"; game.style.display="block"; }

/* オプション */
function showOptions(){ title.style.display="none"; options.style.display="block"; }
function closeOptions(){ options.style.display="none"; title.style.display="block"; }
</script>
</body>
</html>
