<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  color:#f5f5f5;
  background:#3b2f2f; /* ダークブラウン */
  text-shadow:0 0 5px black;
}

/* UI共通 */
.panel{
  background:rgba(0,0,0,0.5);
  padding:10px;
  margin:10px;
  border-radius:10px;
}

/* ターン */
#turn{
  font-size:32px;
}

/* キャラ */
.char{
  border:4px solid #999;
  border-radius:15px;
  padding:10px;
  margin:10px;
}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 15px gold;}

/* HP */
.hpWrap{background:#222;height:10px;position:relative;}
.hpNow{background:lime;height:10px;}
.hpLost{background:red;height:10px;position:absolute;right:0;}

/* 横画面 */
@media (orientation:landscape){
  #chars{display:flex;}
  .char{width:40%;}
  .char img{width:140px;}
}

/* エフェクト */
#effect{
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,0);
  font-size:42px;
  z-index:999;
}

/* 技ボタン */
.skillBtn{
  margin:5px;
  padding:10px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>バーコードコロシアム</h1>

<!-- タイトル -->
<div id="title" class="panel">
<button onclick="startPVP()">プレイヤー対戦</button><br><br>
<button onclick="startCPU()">CPU対戦</button>
</div>

<!-- ゲーム -->
<div id="game" style="display:none;">

<div class="panel">
<button onclick="manual()">入力召喚</button>
<button onclick="randomGen()">ランダム召喚</button>
<button onclick="scan()">スキャン召喚</button>
</div>

<div id="reader"></div>

<div id="turn" class="panel"></div>

<div id="chars"></div>

<div id="skills" class="panel"></div>

<div id="result" class="panel"></div>

</div>

<script>
let characters=[], current=0;
let gameMode="pvp";

/* 技 */
const skillsBase=[
{name:"強打",power:1.8,miss:0.25},
{name:"魔法",power:1.4,miss:0.15}
];

function assignSkills(){
 return [
  {name:"攻撃",power:1,miss:0.05},
  skillsBase[Math.floor(Math.random()*skillsBase.length)]
 ];
}

/* キャラ */
function gen(){
 return{
  name:"モンスター",
  rarity:"common",
  sprite:"img/c1.png",
  hp:150,
  maxHp:150,
  atk:40,
  def:20,
  skills:assignSkills()
 };
}

/* 召喚 */
function manual(){addChar();}
function randomGen(){addChar();}
function scan(){
 let s=new Html5Qrcode("reader");
 s.start({facingMode:"environment"},{fps:10,qrbox:250},
 txt=>{
  addChar();
  s.stop();
 });
}

function addChar(){
 characters.push(gen());
 render();
 if(characters.length>=2)startBattle();
}

/* バトル */
function startBattle(){
 current=0;
 updateTurn();
 showSkills();
}

function updateTurn(){
 turn.innerText=(current==0?"1P":"2P")+" のターン";
}

/* 技表示（ターンごと更新） */
function showSkills(){
 let c=characters[current];
 let html="";
 c.skills.forEach((s,i)=>{
  html+=`<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`;
 });
 skills.innerHTML=html;
}

/* 技処理 */
function useSkill(i){
 let a=characters[current];
 let d=characters[1-current];
 let s=a.skills[i];

 showSkillName(s.name);

 if(Math.random()<s.miss){
  showResult("Miss");
  next();
  return;
 }

 let dmg=(a.atk-d.def/2)*s.power;
 d.hp-=dmg;
 if(d.hp<0)d.hp=0;

 showResult("Hit");

 render();

 if(d.hp<=0){
  result.innerText=(current==0?"1P":"2P")+" 勝利";
  return;
 }

 next();
}

function next(){
 current=1-current;
 updateTurn();
 showSkills();

 if(gameMode=="cpu" && current==1){
  setTimeout(()=>{
   let r=Math.floor(Math.random()*characters[1].skills.length);
   useSkill(r);
  },600);
 }
}

/* 表示 */
function render(){
 let html="";
 characters.forEach(c=>{
  let hpP=c.hp/c.maxHp*100;

  html+=`
  <div class="char ${c.rarity}">
    <img src="${c.sprite}" width=80><br>
    ❤️ ${c.hp}
    <div class="hpWrap">
      <div class="hpNow" style="width:${hpP}%"></div>
      <div class="hpLost" style="width:${100-hpP}%"></div>
    </div>
  </div>`;
 });

 chars.innerHTML=html;
}

/* エフェクト分離 */
function showSkillName(name){
 let e=document.createElement("div");
 e.id="effect";
 e.innerText=name;
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),500);
}

function showResult(text){
 let e=document.createElement("div");
 e.id="effect";
 e.style.top="50%";
 e.innerText=text;
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),500);
}

/* モード */
function startPVP(){
 gameMode="pvp";
 title.style.display="none";
 game.style.display="block";
}

function startCPU(){
 gameMode="cpu";
 title.style.display="none";
 game.style.display="block";
}
</script>

</body>
</html>
