<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バーコードコロシアム Mobile</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root { --purple: #bf00ff; --green: #7cfc00; --red: #ff4d4d; }
body{font-family:sans-serif;margin:0;padding:0;background:#2b2323;color:#f5f5f5;text-align:center;overflow-x:hidden;}
.panel{background:rgba(0,0,0,0.6);padding:10px;margin:5px;border-radius:10px;border:1px solid #444;}
#turn{font-size:24px;margin:5px 0;font-weight:bold;color:gold;}

/* モンスター配置の最適化 */
#chars { display: flex; justify-content: center; gap: 5px; }
.char{border:4px solid #999;border-radius:12px;padding:5px;width:45%;max-width:160px;background:rgba(0,0,0,0.3);box-sizing:border-box;}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 10px gold;}
.char img{width:100%;height:auto;image-rendering:pixelated;}

.hpWrap{background:#222;height:12px;margin:5px 0;border-radius:6px;overflow:hidden;}
.hpNow{background:lime;height:100%;transition:width 0.3s ease;}
.status-badge{font-size:12px;background:#444;padding:2px 5px;border-radius:4px;}

/* 実況ポップアップ（モンスターの下、ボタンの上） */
#effect {
  position: fixed;
  top: 55%; /* モンスターのすぐ下あたり */
  left: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  max-width: 400px;
  background: rgba(0,0,0,0.9);
  padding: 15px;
  border-radius: 15px;
  border: 2px solid #666;
  z-index: 1000;
  font-size: 18px;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
.dmg-text { font-size: 28px; font-weight: bold; display: block; margin: 8px 0; text-shadow: 0 0 10px black; }

/* ボタン類 */
button{font-size:16px;padding:12px;margin:4px;border-radius:8px;background:#444;color:white;border:none;box-shadow:0 3px #222;}
button:active{transform:translateY(2px);box-shadow:none;}
.skillBtn{width:45%; margin:5px; background: #556;}
#skills{margin-top:10px;}
#reader{width:100%; max-width:400px; margin:0 auto;}

/* オプション */
#options { position: fixed; top:0; left:0; width:100%; height:100%; background:#2b2323; z-index:2000; overflow-y:auto; padding:20px; box-sizing:border-box; display:none;}
</style>
</head>
<body>

<div id="title" class="panel">
  <h1 style="color:gold;margin:10px;">バーコードコロシアム</h1>
  <button onclick="startPVP()">プレイヤー対戦</button>
  <button onclick="startCPU()">CPU対戦</button><br>
  <button onclick="showOptions()" style="background:#666;">オプション</button>
</div>

<div id="options">
  <h2>設定・ヘルプ</h2>
  1P名: <input id="player1Name" placeholder="1P" style="padding:8px;border-radius:5px;"><br><br>
  2P名: <input id="player2Name" placeholder="2P" style="padding:8px;border-radius:5px;"><br>
  <hr>
  <div style="text-align:left; font-size:14px;">
    <b>⚡麻痺:</b> 行動不能<br>
    <b>☠猛毒:</b> 毎ターン4%ダメ<br>
    <b>🩻衰弱:</b> ダメ＋攻防低下<br>
    <b>☢被曝:</b> ダメ＋防御大幅低下
  </div>
  <button onclick="closeOptions()" style="margin-top:20px;">閉じる</button>
</div>

<div id="game" style="display:none;">
  <div id="setupPanel" class="panel">
    <button onclick="goTitle()" style="font-size:12px;">← 終了</button>
    <input id="barcodeInput" placeholder="数字入力" style="width:80px;padding:8px;">
    <button onclick="manualInput()">召喚</button>
    <button onclick="scan()" style="background:darkblue;">スキャン</button>
    <button onclick="resetChars()" style="background:darkred;">リセット</button>
  </div>
  
  <div id="reader"></div>

  <div id="battleArea">
    <div id="turn"></div>
    <div id="chars"></div>
    <div id="skills" class="panel"></div>
    <button id="startBattleBtn" style="display:none;background:orange;width:90%;" onclick="startBattle()">バトル開始！！</button>
    <button id="rematchBtn" style="display:none;background:green;width:90%;" onclick="rematch()">再戦</button>
  </div>
</div>

<script>
let characters=[], current=0, gameMode="pvp";
let player1NameVal="1P", player2NameVal="2P";
let battleStarted=false, waitingForCPU=false;
let pendingWin = null, hpVisual = [], animRunning = false, scanner = null;

const IMAGES={
  common:Array.from({length:12},(_,i)=>`img/c${i+1}.png`),
  rare:Array.from({length:5},(_,i)=>`img/r${i+1}.png`),
  ssr:Array.from({length:3},(_,i)=>`img/s${i+1}.png`)
};

function createHash(code){
  let h = 0;
  for(let i=0;i<code.length;i++){ h = (h << 5) - h + code.charCodeAt(i); h |= 0; }
  h ^= (h << 13); h ^= (h >> 17); h ^= (h << 5);
  return (h * 2654435761) >>> 0;
}

function assignSkills(hash, rarity){
  let pool = [
    {name:"強打", power:1.8, miss:0.30}, {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, instant:0.05}, {name:"憤怒", buffAtk:1.3},
    {name:"鉄壁", buffDef:1.3}, {name:"再生", heal:0.1, buffDef:1.1},
    {name:"疫病", debuffAtk:0.93, debuffDef:0.93}, {name:"電撃", power:1.2, status:"paralyze", rate:0.3, miss:0.15},
    {name:"毒液", power:0.3, status:"poison", rate:0.7, miss:0.15},
    {name:"呪詛", status:"weaken"}, {name:"汚染", power:0.3, status:"irradiate", rate:0.3, miss:0.15}
  ];
  let s = [{name:"攻撃", power:1.0}];
  let i1 = hash % pool.length;
  let i2 = (hash + 7) % pool.length;
  if(i1===i2) i2 = (i2 + 1) % pool.length;
  s.push(pool[i1], pool[i2]);
  if(rarity==="ssr") s.push({name:"奥義", power:3.0, used:false});
  return s;
}

function genCharacter(code=""){
  let h = code ? createHash(code) : Math.floor(Math.random()*999999);
  let r = (h % 100) / 100;
  let rarity = r < 0.04 ? "ssr" : (r < 0.24 ? "rare" : "common");
  let atk = 40 + (h % 15), def = 20 + (h % 10), hp = 300 + (h % 70);
  if(rarity==="rare"){ atk*=1.2; def*=1.2; hp*=1.2; }
  if(rarity==="ssr"){ atk*=1.4; def*=1.4; hp*=1.4; }
  return {
    name: (rarity==="ssr"?"極度":"") + "モンスター" + (h%999),
    rarity, atk:Math.floor(atk), def:Math.floor(def), hp:Math.floor(hp), maxHp:Math.floor(hp),
    tempAtk:Math.floor(atk), tempDef:Math.floor(def), status:null,
    sprite: IMAGES[rarity][h % IMAGES[rarity].length],
    skills: assignSkills(h, rarity)
  };
}

async function addChar(code=""){
  if(characters.length>=2) return;
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  let c = genCharacter(code);
  characters.push(c); hpVisual.push(c.hp);
  render();
  showEffect(c.name + " を召喚！");
  if(characters.length==2) document.getElementById("startBattleBtn").style.display="block";
}

function manualInput(){ let v=document.getElementById("barcodeInput").value; if(v) addChar(v); }
function scan(){
  if(scanner) return;
  scanner = new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"}, {fps:10, qrbox:250}, txt=>{ addChar(txt); }, err=>{})
  .catch(e=>{ alert("カメラを許可してください"); scanner=null; });
}

function render(){
  document.getElementById("turn").innerText = battleStarted ? `${current==0?player1NameVal:player2NameVal}のターン` : "";
  let html = "";
  characters.forEach((c,i)=>{
    let hpP = (hpVisual[i]/c.maxHp)*100;
    let color = hpP<30?"red":hpP<60?"orange":"lime";
    html += `<div class="char ${c.rarity}"><div style="font-size:10px">${c.rarity.toUpperCase()}</div><img src="${c.sprite}"><div class="hpWrap"><div class="hpNow" style="width:${hpP}%;background:${color}"></div></div><div style="font-size:12px">HP:${Math.floor(c.hp)}</div><div class="status-badge">${c.status?c.status:"健康"}</div></div>`;
  });
  document.getElementById("chars").innerHTML = html;
}

function showEffect(msg, cb){
  let e=document.createElement("div"); e.id="effect";
  e.innerHTML = msg + "<br><small style='color:#888'>Tap to Continue</small>";
  e.onclick = ()=>{ e.remove(); if(cb) cb(); };
  document.body.appendChild(e);
}

function startBattle(){
  document.getElementById("setupPanel").style.display="none";
  document.getElementById("startBattleBtn").style.display="none";
  battleStarted=true; animateHP(); proceedTurn();
}

function showSkills(){
  let c = characters[current], html = "";
  c.skills.forEach((s,i)=>{
    html += `<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`;
  });
  document.getElementById("skills").innerHTML = html;
}

function useSkill(i){
  if(!battleStarted || waitingForCPU) return;
  let a=characters[current], d=characters[1-current], s=a.skills[i];
  if(s.name==="奥義" && s.used) return;
  if(s.name==="奥義") s.used=true;
  
  waitingForCPU = true;
  let msg = `${a.name}の${s.name}！`;

  if(s.miss && Math.random()<s.miss){
    msg += `<span class="dmg-text" style="color:var(--purple)">MISS !!</span>`;
  } else {
    if(s.power){
      let crit = Math.random()<0.05;
      let dmg = Math.max(1, Math.floor(((a.tempAtk-d.tempDef/2)*s.power)*(crit?2:1)));
      d.hp = Math.max(0, d.hp - dmg);
      if(crit) msg += `<span class="dmg-text" style="color:gold">CRITICAL !!</span>`;
      msg += `<span class="dmg-text" style="color:var(--red)">${dmg} DAMAGE</span>`;
    }
    if(s.heal){ let h=Math.floor(a.maxHp*0.1); a.hp=Math.min(a.maxHp, a.hp+h); msg+=`<br>${h}回復！`; }
    if(s.status && !d.status && Math.random()<(s.rate||1)) d.status=s.status;
  }

  render();
  showEffect(msg, ()=>{ if(d.hp<=0) pendingWin=current==0?player1NameVal:player2NameVal; waitingForCPU=false; nextTurn(); });
}

function nextTurn(){
  if(pendingWin){ showWin(pendingWin); return; }
  current = 1 - current;
  let c = characters[current], name = current==0?player1NameVal:player2NameVal;

  if(c.status==="paralyze"){ showEffect(name+"は麻痺で動けない！", ()=>{ c.status=null; nextTurn(); }); return; }
  if(c.status && c.status!=="paralyze"){
    let dmg = Math.floor(c.maxHp*0.04), color="var(--purple)", icon="☠️";
    if(c.status==="irradiate"){ color="var(--green)"; icon="☢️"; dmg=Math.floor(c.maxHp*0.03); }
    c.hp = Math.max(0, c.hp-dmg);
    render();
    showEffect(`${name}は異常ダメージ！<span class="dmg-text" style="color:${color}">${icon} ${dmg} ダメージ</span>`, ()=>{
      if(c.hp<=0) showWin(current==0?player2NameVal:player1NameVal); else proceedTurn();
    });
    return;
  }
  proceedTurn();
}

function proceedTurn(){
  render(); showSkills();
  if(gameMode==="cpu" && current===1){
    setTimeout(()=>{ let u=characters[1].skills; useSkill(Math.floor(Math.random()*u.length)); }, 800);
  }
}

function animateHP(){
  if(animRunning) return; animRunning=true;
  function loop(){
    characters.forEach((c,i)=>{ hpVisual[i]+=(c.hp-hpVisual[i])*0.1; });
    render(); requestAnimationFrame(loop);
  }
  loop();
}

function showWin(w){
  battleStarted=false; document.getElementById("skills").innerHTML="";
  document.getElementById("rematchBtn").style.display="block";
  showEffect("<span class='dmg-text' style='color:gold'>WINNER: "+w+"</span>");
}

function rematch(){
  characters.forEach(c=>{ c.hp=c.maxHp; c.status=null; });
  hpVisual = characters.map(c=>c.hp); pendingWin=null;
  document.getElementById("rematchBtn").style.display="none";
  startBattle();
}

async function resetChars(){
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  characters=[]; hpVisual=[]; battleStarted=false;
  document.getElementById("chars").innerHTML=""; document.getElementById("startBattleBtn").style.display="none";
  render();
}

async function goTitle(){
  await resetChars();
  document.getElementById("game").style.display="none";
  document.getElementById("title").style.display="block";
  document.getElementById("setupPanel").style.display="block";
}

function startPVP(){ player1NameVal=document.getElementById("player1Name").value||"1P"; player2NameVal=document.getElementById("player2Name").value||"2P"; gameMode="pvp"; document.getElementById("title").style.display="none"; document.getElementById("game").style.display="block"; }
function startCPU(){ player1NameVal=document.getElementById("player1Name").value||"1P"; player2NameVal="CPU"; gameMode="cpu"; document.getElementById("title").style.display="none"; document.getElementById("game").style.display="block"; }
function showOptions(){ document.getElementById("options").style.display="block"; }
function closeOptions(){ document.getElementById("options").style.display="none"; }
</script>
</body>
</html>
