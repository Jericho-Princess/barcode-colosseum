<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム (Native Scan)</title>
<style>
/* スタイルは維持 */
body{font-family:sans-serif;margin:0;padding:0;background:#3b2f2f;color:#f5f5f5;text-align:center;text-shadow:0 0 5px black;}
.panel{background:rgba(0,0,0,0.5);padding:15px;margin:10px;border-radius:15px;font-size:18px;}
#turn{font-size:32px;margin:10px 0;}
.char{border:5px solid #999;border-radius:15px;padding:10px;margin:10px;display:inline-block;width:140px;height:320px;box-sizing:border-box;vertical-align:top;}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 15px gold;}
.hpWrap{background:#222;height:15px;position:relative;margin-top:5px;}
.hpNow{background:lime;height:15px;transition:width 0.2s linear;}
#gameContent{display:flex;flex-direction:column;align-items:center;}
#charsAndSkills{display:flex;flex-direction:row;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
#skills{margin-left:20px; min-width: 200px;}
#cameraWrap{position:relative;width:100%;max-width:400px;margin:auto;}
#video{width:100%;height:250px;background:black;border-radius:10px;}
#cameraWrap::after{content:"";position:absolute;top:50%;left:50%;width:70%;height:40%;border:3px solid red;transform:translate(-50%,-50%);pointer-events:none;}
#effect{position:fixed;top:30%;left:50%;transform:translate(-50%,0);font-size:24px;z-index:999;background:rgba(0,0,0,0.9);padding:20px;border-radius:15px;border:2px solid gold;}
.skillBtn{margin:10px;padding:15px 25px;font-size:18px;border-radius:10px;cursor:pointer;background:#eee;color:#222;border:none;font-weight:bold;}
.skillBtn:disabled{background:#666;color:#999;cursor:not-allowed;}
button{font-size:18px;padding:12px 20px;margin:5px;border-radius:10px;cursor:pointer;}
input{font-size:18px;padding:10px;margin:5px;border-radius:10px;}
.status{font-size:14px;margin-top:5px;color: #ffeb3b;}
</style>
</head>
<body>

<div id="title" class="panel">
  <h1>バーコードコロシアム</h1>
  <button onclick="startPVP()">プレイヤー対戦</button><br><br>
  <button onclick="startCPU()">CPU対戦</button><br><br>
  <button onclick="showOptions()">オプション</button>
</div>

<div id="options" class="panel" style="display:none;">
  プレイヤー1: <input id="player1Name" placeholder="1P"><br>
  プレイヤー2: <input id="player2Name" placeholder="2P"><br>
  <button onclick="closeOptions()">閉じる</button>
</div>

<div id="game" style="display:none;">
  <button onclick="goTitle()">← タイトルに戻る</button>
  <div class="panel">
    数字入力: <input id="barcodeInput" type="tel">
    <button onclick="manualInput()">召喚</button><br><br>
    <button onclick="scan()">スキャン開始</button>
    <button onclick="stopScan()" id="stopBtn" style="display:none;">停止</button>
    <button onclick="resetChars()">リセット</button>
  </div>
  <button onclick="rematch()" style="display:none;" id="rematchBtn">再戦</button>

  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="gameContent">
    <div id="turn" class="panel"></div>
    <div id="charsAndSkills">
      <div id="chars"></div>
      <div id="skills" class="panel"></div>
    </div>
    <button id="startBattleBtn" style="display:none;" onclick="startBattle()">バトル開始</button>
  </div>
</div>

<script>
let characters=[], current=0, gameMode="pvp";
let player1NameVal="1P", player2NameVal="2P";
let battleStarted=false, waitingForCPU=false, pendingWin = null;
let hpVisual = [], animRunning = false, isScanning = false;

// 共通データ
const IMAGES={
  common:Array.from({length:12},(_,i)=>`img/c${i+1}.png`),
  rare:Array.from({length:5},(_,i)=>`img/r${i+1}.png`),
  ssr:Array.from({length:3},(_,i)=>`img/s${i+1}.png`)
};

// --- スキャン機能 (Native Barcode Detector API) ---
async function scan() {
  if (isScanning) return;
  
  const video = document.getElementById("video");
  const stopBtn = document.getElementById("stopBtn");

  try {
    // 1. カメラストリームの開始
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: "environment", 
        width: { ideal: 1280 }, 
        height: { ideal: 720 } 
      }
    });
    video.srcObject = stream;
    await video.play();
    
    isScanning = true;
    stopBtn.style.display = "inline-block";

    // 2. BarcodeDetector の初期化
    // 対応している可能性のあるフォーマットをすべて羅列します
    const formats = [
      'aztec', 'code_128', 'code_39', 'code_93', 'codabar', 
      'data_matrix', 'ean_13', 'ean_8', 'itf', 'pdf417', 
      'qr_code', 'upc_a', 'upc_e'
    ];
    
    // ブラウザがサポートしているフォーマットだけに絞り込む（エラー防止）
    const supportedFormats = await BarcodeDetector.getSupportedFormats();
    const useFormats = formats.filter(f => supportedFormats.includes(f));
    
    const barcodeDetector = new BarcodeDetector({ formats: useFormats.length > 0 ? useFormats : ['ean_13'] });

    // 3. 高速解析ループ
    const detectLoop = async () => {
      if (!isScanning) return;
      
      try {
        // ビデオ要素からバーコードを検出
        const barcodes = await barcodeDetector.detect(video);
        
        if (barcodes.length > 0) {
          const code = barcodes[0].rawValue;
          console.log("Native Scan 成功:", code);
          
          // 成功したら即停止して召喚
          stopScan();
          setTimeout(() => {
            addChar(createCharacterFromBarcode(code));
          }, 200);
        } else {
          // 見つからなければ次のフレームへ
          requestAnimationFrame(detectLoop);
        }
      } catch (e) {
        // ループ中にエラーが出ても止まらずに継続
        console.error("Detection error:", e);
        requestAnimationFrame(detectLoop);
      }
    };
    
    detectLoop();

  } catch (e) {
    console.error("Scan setup error:", e);
    alert("スキャンを開始できませんでした。");
    stopBtn.style.display = "none";
  }
}

function stopScan() {
  isScanning = false;
  const video = document.getElementById("video");
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  document.getElementById("stopBtn").style.display = "none";
}

// --- キャラクターロジック ---
function createCharacterFromBarcode(code) {
  let hash = 0;
  for(let i=0; i<code.length; i++) hash = (hash << 5) - hash + code.charCodeAt(i);
  hash = Math.abs(hash);

  const r = (hash % 100) / 100;
  const rarity = r < 0.05 ? "ssr" : r < 0.25 ? "rare" : "common";

  let hp = 300 + (hash % 100);
  let atk = 40 + (hash % 20);
  let def = 20 + (hash % 15);

  if(rarity === "rare") { hp *= 1.2; atk *= 1.2; def *= 1.2; }
  if(rarity === "ssr")  { hp *= 1.5; atk *= 1.5; def *= 1.5; }

  return {
    name: "M-" + code.slice(-4),
    rarity, hp: Math.floor(hp), maxHp: Math.floor(hp),
    atk: Math.floor(atk), def: Math.floor(def),
    tempAtk: Math.floor(atk), tempDef: Math.floor(def),
    sprite: IMAGES[rarity][hash % IMAGES[rarity].length],
    skills: assignSkills(rarity, hash),
    status: null
  };
}

function assignSkills(rarity, hash) {
  const pool = [
    {name:"強打", power:1.7, miss:0.2}, {name:"毒針", power:0.5, instant:0.05},
    {name:"鉄壁", buffDef:1.4}, {name:"再生", heal:0.15},
    {name:"電撃", power:1.2, status:"paralyze", rate:0.3},
    {name:"呪詛", status:"weaken"}
  ];
  let s = [{name:"攻撃", power:1.0}];
  s.push(pool[hash % pool.length]);
  s.push(pool[(hash + 1) % pool.length]);
  if(rarity === "ssr") s.push({name:"奥義", power:3.0, used:false});
  return s;
}

function addChar(c) {
  if(characters.length >= 2) return;
  showEffect(c.rarity.toUpperCase() + "出現！<br>" + c.name, () => {
    characters.push(c);
    hpVisual.push(c.hp);
    render();
    if(characters.length === 2) document.getElementById("startBattleBtn").style.display = "inline-block";
  });
}

// --- バトルシステム (以前のロジックを最適化) ---
function render() {
  const turnDisplay = document.getElementById("turn");
  turnDisplay.innerText = battleStarted ? (current === 0 ? player1NameVal : player2NameVal) + "のターン" : "";
  
  let html = "";
  characters.forEach((c, i) => {
    const hpP = (hpVisual[i] / c.maxHp) * 100;
    html += `<div class="char ${c.rarity}">
      <img src="${c.sprite}" width="120" height="150"><br>
      <b>${c.name}</b><br>
      HP: ${Math.floor(c.hp)} / ${c.maxHp}<br>
      ATK: ${Math.floor(c.tempAtk)} DEF: ${Math.floor(c.tempDef)}
      <div class="hpWrap"><div class="hpNow" style="width:${hpP}%; background:${hpP < 30 ? 'red' : 'lime'}"></div></div>
      <div class="status">${c.status || ""}</div>
    </div>`;
  });
  document.getElementById("chars").innerHTML = html;
}

function useSkill(idx) {
  if (waitingForCPU || !battleStarted) return;
  const a = characters[current], d = characters[1-current], s = a.skills[idx];
  if (s.used) return;
  
  waitingForCPU = true;
  let msg = a.name + "の" + s.name + "！";
  if (s.name === "奥義") s.used = true;

  // 判定処理
  if (s.miss && Math.random() < s.miss) {
    msg += "<br>ミス！";
  } else {
    if (s.power) {
      let dmg = Math.floor((a.tempAtk * s.power) - (d.tempDef * 0.5));
      dmg = Math.max(1, dmg);
      d.hp = Math.max(0, d.hp - dmg);
      msg += `<br>${dmg}のダメージ！`;
    }
    if (s.heal) {
      let h = Math.floor(a.maxHp * s.heal);
      a.hp = Math.min(a.maxHp, a.hp + h);
      msg += `<br>${h}回復した！`;
    }
    if (s.buffDef) { a.tempDef *= s.buffDef; msg += "<br>防御が上がった！"; }
    if (s.status && Math.random() < (s.rate || 1)) { d.status = s.status; msg += `<br>${s.status}状態にした！`; }
  }

  showEffect(msg, () => {
    if (d.hp <= 0) {
      showWin(current === 0 ? player1NameVal : player2NameVal);
    } else {
      waitingForCPU = false;
      current = 1 - current;
      render();
      if(gameMode === "cpu" && current === 1) setTimeout(cpuTurn, 800);
      else showSkills();
    }
  });
}

// その他UI/管理用関数 (reset, rematch, startBattle などは以前と同様)
function showSkills() {
  const c = characters[current];
  let html = "";
  c.skills.forEach((s, i) => {
    html += `<button class="skillBtn" onclick="useSkill(${i})" ${s.used ? 'disabled' : ''}>${s.name}</button>`;
  });
  document.getElementById("skills").innerHTML = html;
}

function cpuTurn() {
  const usable = characters[1].skills.map((s,i)=>({s,i})).filter(o => !o.s.used);
  const r = Math.floor(Math.random() * usable.length);
  useSkill(usable[r].i);
}

function showEffect(msg, cb) {
  const e = document.createElement("div"); e.id = "effect";
  e.innerHTML = msg + "<br><small>(クリックで次へ)</small>";
  e.onclick = () => { e.remove(); if(cb) cb(); };
  document.body.appendChild(e);
}

function startBattle() {
  battleStarted = true;
  document.getElementById("startBattleBtn").style.display = "none";
  hpVisual = characters.map(c => c.hp);
  if (!animRunning) { animRunning = true; loop(); }
  showSkills();
  render();
}

function loop() {
  characters.forEach((c, i) => {
    hpVisual[i] += (c.hp - hpVisual[i]) * 0.1;
  });
  render();
  requestAnimationFrame(loop);
}

function startPVP() { gameMode="pvp"; setupGame(); }
function startCPU() { gameMode="cpu"; setupGame(); }
function setupGame() { 
  player1NameVal = document.getElementById("player1Name").value || "1P";
  player2NameVal = gameMode==="cpu" ? "CPU" : (document.getElementById("player2Name").value || "2P");
  document.getElementById("title").style.display="none"; 
  document.getElementById("game").style.display="block"; 
}
function goTitle() { location.reload(); }
function showOptions() { document.getElementById("options").style.display="block"; }
function closeOptions() { document.getElementById("options").style.display="none"; }
function manualInput() { const v = document.getElementById("barcodeInput").value; if(v) addChar(createCharacterFromBarcode(v)); }
function resetChars() { characters=[]; hpVisual=[]; render(); document.getElementById("startBattleBtn").style.display="none"; }
function showWin(w) { battleStarted=false; showEffect("🏆勝者: " + w, () => document.getElementById("rematchBtn").style.display="inline-block"); }
function rematch() { characters.forEach(c => {c.hp=c.maxHp; c.status=null; c.tempAtk=c.atk; c.tempDef=c.def; c.skills.forEach(s=>s.used=false);}); current=0; startBattle(); document.getElementById("rematchBtn").style.display="none";}
</script>
</body>
</html>
