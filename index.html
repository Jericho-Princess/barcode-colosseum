<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root { --purple: #ff00ff; --green: #7cfc00; --red: #ff4d4d; --gold: #ffd700; --blue: #4da6ff; }
body{font-family:sans-serif;margin:0;padding:0;background:#3b2f2f;color:#f5f5f5;text-align:center;overflow-x:hidden;text-shadow:0 0 5px black;}
.panel{background:rgba(0,0,0,0.5);padding:10px;margin:8px;border-radius:12px;border:1px solid #444;}
#turn{font-size:28px;margin:8px 0;font-weight:bold;color:var(--gold);min-height:36px;}

#chars { display: flex; justify-content: center; gap: 8px; margin-top:10px;}
.char {
  border: 6px solid #999; border-radius: 18px; padding: 12px;
  width: 48%; max-width: 200px; height: 380px; 
  background: rgba(0,0,0,0.6); box-sizing: border-box; 
  display: flex; flex-direction: column;
}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:var(--gold);box-shadow:0 0 25px var(--gold);}

.img-box { 
  flex-grow: 1; display: flex; align-items: center; justify-content: center; 
  min-height: 160px; margin: 5px 0; 
}
.char img{ width: auto; height: auto; max-width: 100%; max-height: 180px; image-rendering: pixelated; }

.char-name { font-size: 14px; font-weight: bold; display: block; height: 1.4em; overflow: hidden; margin-bottom: 5px; border-bottom: 1px solid #666; }
.status-area { margin-top: auto; }
.hp-text { font-size: 18px; font-weight: bold; margin-bottom: 5px; display: block; }
.hpWrap{background:#222;height:20px;border-radius:10px;overflow:hidden;margin:8px 0;position:relative; border:1px solid #555;}
.hpNow{background:lime;height:100%;transition:width 0.3s linear;}
.status-badge{font-size:18px;margin-top:8px;font-weight:bold;min-height:26px;}
.stats-info {
  display:flex; justify-content: space-around; background:rgba(0,0,0,0.5); 
  border-radius:8px; padding:8px; margin-top:8px; font-size: 18px; font-weight:bold;
}

#effect {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 92%; max-width: 450px; background: rgba(0,0,0,0.95);
  padding: 35px; border-radius: 20px; border: 3px solid #aaa;
  z-index: 3000; font-size: 28px; box-shadow: 0 0 50px black;
}
.dmg-text { font-size: 42px; font-weight: bold; display: block; margin: 15px 0; color: var(--red); }

button{font-size:20px;padding:14px 18px;margin:5px;border-radius:12px;background:#444;color:white;border:none;box-shadow:0 5px #111;}
button:active{transform:translateY(2px);box-shadow:0 2px #111;}
.skillBtn{width:46%; margin:5px; font-size:20px; font-weight: bold; padding: 20px 5px;}
#startBattleBtn{background: orange; width:92%; font-size:30px; margin:20px auto; padding: 20px;}

.header-nav { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(0,0,0,0.4); }
#options { position: fixed; top:0; left:0; width:100%; height:100%; background:#3b2f2f; z-index:4000; overflow-y:auto; padding:25px; box-sizing:border-box; display:none;}
table { width:100%; border-collapse: collapse; margin-top:10px; font-size:14px; }
th, td { border:1px solid #666; padding:8px; text-align:left; }
</style>
</head>
<body>

<div id="title">
  <div class="panel">
    <div style="font-size: 36px; font-weight: bold; margin: 40px 0; color: var(--gold);">BARCODE<br>COLOSSEUM</div>
    <button onclick="startMode('pvp')">プレイヤー対戦</button><br>
    <button onclick="startMode('cpu')">CPU対戦</button><br>
    <button onclick="showOptions()">設定</button>
  </div>
</div>

<div id="options">
  <h2>設定</h2>
  <div class="panel">
    1P: <input id="player1Name" placeholder="1P" style="width:100px; font-size:18px; padding:5px;">
    2P: <input id="player2Name" placeholder="2P" style="width:100px; font-size:18px; padding:5px;">
  </div>
  <button onclick="closeOptions()" style="width:100%; margin-top:15px;">閉じる</button>
</div>

<div id="game" style="display:none;">
  <div class="header-nav">
    <button onclick="goTitle()" style="padding:8px 15px; font-size:14px; background:#8b0000;">終了</button>
    <div id="gameModeLabel" style="font-size:18px; font-weight:bold; color: var(--gold);">PVP</div>
  </div>

  <div id="setupPanel" class="panel">
    バーコード数字: <input id="barcodeInput" type="tel" style="width:120px; padding:10px; font-size:18px;">
    <button onclick="manualInput()">召喚</button><br>
    <button onclick="randomGen()" style="background:#2e8b57; font-size:16px;">ランダム召喚</button>
    <button onclick="scan()" style="background:#483d8b; font-size:16px;">スキャン召喚</button>
  </div>
  
  <div id="reader"></div>

  <div id="battleArea">
    <div id="turn"></div>
    <div id="chars"></div>
    <div id="skills" class="panel"></div>
    <button id="startBattleBtn" style="display:none;" onclick="startBattle()">バトル開始</button>
    <div id="postBattleBtns" style="display:none; width:100%;">
      <button onclick="rematch()" style="background:#2e8b57; width:45%;">再戦する</button>
      <button onclick="resetGame()" style="background:#b22222; width:45%;">リセット</button>
    </div>
  </div>
</div>

<script>
let characters=[], current=0, gameMode="pvp";
let player1NameVal="1P", player2NameVal="2P";
let battleStarted=false, waitingForCPU=false;
let pendingWin = null, hpVisual = [], animRunning = false, scanner = null;

const IMAGES={
  common:Array.from({length:12},(_,i)=>`img/c${i+1}.png`),
  rare:Array.from({length:5},(_,i)=>`img/r${i+1}.png`),
  ssr:Array.from({length:3},(_,i)=>`img/s${i+1}.png`)
};

function createHash(code){
  let h = 0;
  for(let i=0;i<code.length;i++){ h = (h << 5) - h + code.charCodeAt(i); h |= 0; }
  h ^= (h << 13); h ^= (h >> 17); h ^= (h << 5);
  return (h * 2654435761) >>> 0;
}

function assignSkills(hash, rarity){
  let pool = [
    {name:"強打", power:1.8, miss:0.30}, {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, instant:0.05}, {name:"憤怒", buffAtk:1.3},
    {name:"鉄壁", buffDef:1.3}, {name:"再生", heal:0.1, buffDef:1.1},
    {name:"疫病", debuffAtk:0.93, debuffDef:0.93}, {name:"電撃", power:1.2, status:"paralyze", rate:0.3, miss:0.15},
    {name:"毒液", power:0.3, status:"poison", rate:0.7, miss:0.15},
    {name:"呪詛", status:"weaken"}, {name:"汚染", power:0.3, status:"irradiate", rate:0.3, miss:0.15}
  ];
  let s = [{name:"攻撃", power:1.0}];
  let i1 = hash % pool.length;
  let i2 = (hash + 7) % pool.length;
  if(i1===i2) i2 = (i2 + 1) % pool.length;
  s.push(pool[i1], pool[i2]);
  if(rarity==="ssr") s.push({name:"奥義", power:3.0, used:false});
  return s;
}

function genCharacter(code=""){
  let h = code ? createHash(code) : Math.floor(Math.random()*999999);
  let r = (h % 100) / 100;
  let rarity = r < 0.04 ? "ssr" : (r < 0.24 ? "rare" : "common");
  let atk = 40 + (h % 15), def = 20 + (h % 10), hp = 300 + (h % 70);
  if(rarity==="rare"){ atk*=1.15; def*=1.15; hp*=1.15; }
  if(rarity==="ssr"){ atk*=1.3; def*=1.3; hp*=1.3; }
  return {
    name: `モンスター${h % 1000}`, rarity,
    atk:Math.floor(atk), def:Math.floor(def), hp:Math.floor(hp), maxHp:Math.floor(hp),
    tempAtk:Math.floor(atk), tempDef:Math.floor(def), status:null,
    sprite: IMAGES[rarity][h % IMAGES[rarity].length],
    skills: assignSkills(h, rarity)
  };
}

async function addChar(code=""){
  if(characters.length>=2) return;
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  let c = genCharacter(code);
  showEffect(c.name + " が現れた", ()=>{
    characters.push(c); hpVisual.push(c.hp);
    render();
    if(characters.length==2) document.getElementById("startBattleBtn").style.display="block";
  });
}

function manualInput(){ let v=document.getElementById("barcodeInput").value; if(v) addChar(v); }
function randomGen(){ addChar(""); }

function scan() {
  if (scanner) return;
  scanner = new Html5Qrcode("reader");
  scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 250, height: 150 } }, txt => { 
    if (navigator.vibrate) navigator.vibrate(50);
    addChar(txt); 
  }).catch(e => { alert("カメラ失敗"); scanner = null; });
}

function render(){
  if(battleStarted) document.getElementById("turn").innerText = `${current==0?player1NameVal:player2NameVal} のターン`;
  let html = "";
  characters.forEach((c,i)=>{
    let hpP = (hpVisual[i]/c.maxHp)*100;
    let color = hpP<30?"red":hpP<60?"orange":"lime";
    let statusMap = { paralyze: {t:"⚡麻痺", c:"var(--gold)"}, poison: {t:"☠️猛毒", c:"var(--purple)"}, weaken: {t:"🩻衰弱", c:"#9370db"}, irradiate: {t:"☢️被曝", c:"var(--green)"} };
    let sInfo = c.status ? statusMap[c.status] : {t:"健康", c:"#ccc"};
    html += `
      <div class="char ${c.rarity}">
        <b class="char-name">${c.name}</b>
        <div class="img-box"><img src="${c.sprite}"></div>
        <div class="status-area">
          <span class="hp-text">❤️ ${Math.floor(c.hp)} / ${c.maxHp}</span>
          <div class="hpWrap"><div class="hpNow" style="width:${hpP}%;background:${color}"></div></div>
          <div class="stats-info"><span>⚔️${Math.floor(c.tempAtk)}</span> <span>🛡️${Math.floor(c.tempDef)}</span></div>
          <div class="status-badge" style="color:${sInfo.c}">状態：${sInfo.t}</div>
        </div>
      </div>`;
  });
  document.getElementById("chars").innerHTML = html;
}

function showEffect(msg, cb){
  let e=document.createElement("div"); e.id="effect";
  e.innerHTML = msg + "<br><small style='color:#ccc; font-size:16px;'>[ タップ ]</small>";
  e.onclick = ()=>{ e.remove(); if(cb) cb(); };
  document.body.appendChild(e);
}

function startBattle(){
  document.getElementById("setupPanel").style.display="none";
  document.getElementById("startBattleBtn").style.display="none";
  current = Math.random() < 0.5 ? 0 : 1;
  battleStarted=true; animateHP(); proceedTurn();
}

function showSkills(){
  let c = characters[current], html = "";
  c.skills.forEach((s,i)=>{ html += `<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`; });
  document.getElementById("skills").innerHTML = html;
}

function useSkill(i){
  if(!battleStarted || waitingForCPU) return;
  let a=characters[current], d=characters[1-current], s=a.skills[i];
  if(s.name==="奥義" && s.used) return;
  if(s.name==="奥義") s.used=true;
  waitingForCPU = true;
  let name = current == 0 ? player1NameVal : player2NameVal;
  let msg = name + " の " + s.name;
  if(s.miss && Math.random()<s.miss){ msg += `<br><span class="dmg-text" style="color:var(--blue)">MISS</span>`; } else {
    if(s.instant && Math.random()<s.instant){ d.hp = 0; msg += "<br><b style='color:red'>即死</b>"; }
    if(s.heal){ let h=Math.floor(a.maxHp*0.1); a.hp=Math.min(a.maxHp, a.hp+h); a.tempDef*=1.1; msg+=`<br>回復 ＆ 防護`; }
    if(s.buffAtk) { a.tempAtk *= 1.3; msg += "<br>攻撃上昇"; }
    if(s.power){
      let crit = Math.random() < 0.05, ran = 0.9 + Math.random() * 0.2;
      let dmg = Math.max(1, Math.floor((a.tempAtk - d.tempDef/2) * s.power * (crit ? 2 : 1) * ran));
      d.hp = Math.max(0, d.hp - dmg);
      if(crit) msg += `<br><span class="dmg-text" style="color:var(--gold)">CRITICAL</span>`;
      msg += `<br><span class="dmg-text">HIT ${dmg}</span>`;
    }
    if(s.status && !d.status && Math.random()<(s.rate||1)) d.status=s.status;
  }
  render();
  showEffect(msg, ()=>{ if(d.hp<=0) pendingWin=name; waitingForCPU=false; nextTurn(); });
}

function nextTurn(){
  if(pendingWin){ showWin(pendingWin); return; }
  current = 1 - current;
  let c = characters[current], name = current==0?player1NameVal:player2NameVal;
  if(c.status==="paralyze"){ showEffect(name + " は麻痺している", ()=>{ c.status = null; nextTurn(); }); return; }
  if(c.status){
    let dmg = Math.floor(c.maxHp*0.04);
    c.hp = Math.max(0, c.hp-dmg); render();
    showEffect(name + " 状態ダメージ<br><span class='dmg-text'>"+dmg+"</span>", ()=>{
      if(c.hp<=0) showWin(current==0?player2NameVal:player1NameVal); else proceedTurn();
    });
    return;
  }
  proceedTurn();
}

function proceedTurn(){ render(); showSkills(); if(gameMode==="cpu" && current===1) setTimeout(()=>useSkill(Math.floor(Math.random()*characters[1].skills.length)), 600); }
function animateHP(){ if(animRunning) return; animRunning=true; function loop(){ characters.forEach((c,i)=>{ if(hpVisual[i]!==undefined) hpVisual[i]+=(c.hp-hpVisual[i])*0.15; }); render(); requestAnimationFrame(loop); } loop(); }
function showWin(w){ battleStarted=false; document.getElementById("skills").innerHTML=""; document.getElementById("postBattleBtns").style.display="flex"; showEffect(w + " の勝利"); }

function resetGame(){
  characters=[]; hpVisual=[]; battleStarted=false; pendingWin=null;
  document.getElementById("turn").innerText = ""; document.getElementById("skills").innerHTML = ""; document.getElementById("chars").innerHTML = "";
  document.getElementById("postBattleBtns").style.display = "none"; document.getElementById("setupPanel").style.display="block";
}

function rematch(){ characters.forEach(c=>{ c.hp=c.maxHp; c.status=null; c.tempAtk=c.atk; c.tempDef=c.def; c.skills.forEach(s=>{if(s.name==="奥義")s.used=false;}); }); hpVisual = characters.map(c=>c.hp); pendingWin=null; document.getElementById("postBattleBtns").style.display="none"; startBattle(); }

async function goTitle(){
  if(confirm("敵前逃亡するつもりか？")){
    if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
    resetGame(); document.getElementById("game").style.display="none"; document.getElementById("title").style.display="block";
  }
}

function startMode(m){
  player1NameVal=document.getElementById("player1Name").value||"1P";
  player2NameVal=m==="cpu"?"CPU":(document.getElementById("player2Name").value||"2P");
  gameMode=m; document.getElementById("gameModeLabel").innerText = m.toUpperCase();
  document.getElementById("title").style.display="none"; document.getElementById("game").style.display="block";
}
function showOptions(){ document.getElementById("options").style.display="block"; }
function closeOptions(){ document.getElementById("options").style.display="none"; }
</script>
</body>
</html>
