<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バーコードコロシアム 真・究極版</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root { --purple: #ff00ff; --green: #7cfc00; --red: #ff4d4d; --gold: #ffd700; --blue: #4da6ff; }
body{font-family:sans-serif;margin:0;padding:0;background:#3b2f2f;color:#f5f5f5;text-align:center;overflow-x:hidden;text-shadow:0 0 5px black;}
.panel{background:rgba(0,0,0,0.5);padding:10px;margin:8px;border-radius:12px;border:1px solid #444;}
#turn{font-size:26px;margin:5px 0;font-weight:bold;color:var(--gold);min-height:32px;}

/* レイアウト */
#chars { display: flex; justify-content: center; gap: 8px; margin-top:10px;}
.char{border:5px solid #999;border-radius:15px;padding:5px;width:45%;max-width:160px;background:rgba(0,0,0,0.5);box-sizing:border-box;}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:var(--gold);box-shadow:0 0 15px var(--gold);}
.char img{width:100%;height:auto;image-rendering:pixelated;margin-bottom:5px;}

.hpWrap{background:#222;height:14px;border-radius:7px;overflow:hidden;margin:5px 0;position:relative;}
.hpNow{background:lime;height:100%;transition:width 0.3s linear;}
.status-badge{font-size:14px;margin-top:5px;font-weight:bold;}

/* 演出ポップアップ (モンスターの下、ボタンの上) */
#effect {
  position: fixed; top: 55%; left: 50%; transform: translate(-50%, -50%);
  width: 90%; max-width: 420px; background: rgba(0,0,0,0.85);
  padding: 20px; border-radius: 15px; border: 2px solid #666;
  z-index: 3000; font-size: 22px; box-shadow: 0 0 20px black;
}
.dmg-text { font-size: 28px; font-weight: bold; display: block; margin: 5px 0; }

/* ボタン類 */
button{font-size:18px;padding:12px 16px;margin:4px;border-radius:10px;background:#444;color:white;border:none;box-shadow:0 4px #111;}
button:active{transform:translateY(2px);box-shadow:0 2px #111;}
.skillBtn{width:46%; margin:5px;}
#startBattleBtn{background: orange; width:90%; font-size:22px; margin:15px auto;}

.header-nav { display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(0,0,0,0.3); }
#options { position: fixed; top:0; left:0; width:100%; height:100%; background:#3b2f2f; z-index:4000; overflow-y:auto; padding:20px; box-sizing:border-box; display:none;}
table { width: 100%; font-size: 14px; border-collapse: collapse; margin-top: 10px; text-align: left;}
table th, table td { border-bottom: 1px solid #666; padding: 8px 4px; }
</style>
</head>
<body>

<div id="title">
  <div class="panel">
    <img src="img/logo.png" style="width:300px; max-width:85%; margin:20px 0;"><br>
    <button onclick="startMode('pvp')">プレイヤー対戦</button><br>
    <button onclick="startMode('cpu')">CPU対戦</button><br>
    <button onclick="showOptions()">オプション</button>
  </div>
</div>

<div id="options">
  <h2>技・状態異常 一覧</h2>
  <div class="panel">
    1P: <input id="player1Name" placeholder="1P" style="width:80px; font-size:16px;">
    2P: <input id="player2Name" placeholder="2P" style="width:80px; font-size:16px;">
  </div>
  <table>
    <tr><th>技名</th><th>内容・効果</th></tr>
    <tr><td>攻撃</td><td>通常ダメージ</td></tr>
    <tr><td>強打</td><td>高威力 (30%でミス)</td></tr>
    <tr><td>魔法</td><td>中威力 (15%でミス)</td></tr>
    <tr><td>毒針</td><td>小威力 (5%で相手を即死)</td></tr>
    <tr><td>電撃</td><td>30%で相手を【麻痺】</td></tr>
    <tr><td>毒液</td><td>70%で相手を【猛毒】</td></tr>
    <tr><td>呪詛</td><td>100%で相手を【衰弱】</td></tr>
    <tr><td>汚染</td><td>30%で相手を【被曝】</td></tr>
    <tr><td>奥義</td><td>SSR専用・超絶威力 (1回限定)</td></tr>
  </table>
  <div style="text-align:left; font-size:14px; padding:15px 5px;">
    <li><b>⚡麻痺:</b> 1ターン行動不能。</li>
    <li><b>☠猛毒:</b> 毎ターン、最大HPの4%ダメージ。</li>
    <li><b>🩻衰弱:</b> 毎ターン4%ダメ＋攻撃・防御が低下。</li>
    <li><b>☢被曝:</b> 毎ターン3%ダメ＋防御が大幅低下。</li>
  </div>
  <button onclick="closeOptions()" style="width:100%;">閉じる</button>
</div>

<div id="game" style="display:none;">
  <div class="header-nav">
    <button onclick="goTitle()" style="padding:5px 10px; font-size:12px; background:#8b0000;">🏠 タイトルへ</button>
    <div id="gameModeLabel" style="font-size:14px; line-height:30px; font-weight:bold;">PVP</div>
  </div>

  <div id="setupPanel" class="panel">
    バーコード数字: <input id="barcodeInput" style="width:100px; padding:5px;">
    <button onclick="manualInput()">召喚</button><br><br>
    <button onclick="randomGen()" style="background:#2e8b57;">ランダム召喚</button>
    <button onclick="scan()" style="background:#483d8b;">スキャン召喚</button>
    <button onclick="resetChars()" style="background:#555;">リセット</button>
  </div>
  
  <div id="reader"></div>

  <div id="battleArea">
    <div id="turn"></div>
    <div id="chars"></div>
    <div id="skills" class="panel"></div>
    <button id="startBattleBtn" style="display:none;" onclick="startBattle()">バトル開始</button>
    <button id="rematchBtn" style="display:none; background:#2e8b57; width:90%;" onclick="rematch()">再戦</button>
  </div>
</div>

<script>
let characters=[], current=0, gameMode="pvp";
let player1NameVal="1P", player2NameVal="2P";
let battleStarted=false, waitingForCPU=false;
let pendingWin = null, hpVisual = [], animRunning = false, scanner = null;

const IMAGES={
  common:Array.from({length:12},(_,i)=>`img/c${i+1}.png`),
  rare:Array.from({length:5},(_,i)=>`img/r${i+1}.png`),
  ssr:Array.from({length:3},(_,i)=>`img/s${i+1}.png`)
};

function createHash(code){
  let h = 0;
  for(let i=0;i<code.length;i++){ h = (h << 5) - h + code.charCodeAt(i); h |= 0; }
  h ^= (h << 13); h ^= (h >> 17); h ^= (h << 5);
  return (h * 2654435761) >>> 0;
}

function assignSkills(hash, rarity){
  let pool = [
    {name:"強打", power:1.8, miss:0.30}, {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, instant:0.05}, {name:"憤怒", buffAtk:1.3},
    {name:"鉄壁", buffDef:1.3}, {name:"再生", heal:0.1, buffDef:1.1},
    {name:"疫病", debuffAtk:0.93, debuffDef:0.93}, {name:"電撃", power:1.2, status:"paralyze", rate:0.3, miss:0.15},
    {name:"毒液", power:0.3, status:"poison", rate:0.7, miss:0.15},
    {name:"呪詛", status:"weaken"}, {name:"汚染", power:0.3, status:"irradiate", rate:0.3, miss:0.15}
  ];
  let s = [{name:"攻撃", power:1.0}];
  let i1 = hash % pool.length;
  let i2 = (hash + 7) % pool.length;
  if(i1===i2) i2 = (i2 + 1) % pool.length;
  s.push(pool[i1], pool[i2]);
  if(rarity==="ssr") s.push({name:"奥義", power:3.0, used:false});
  return s;
}

function genCharacter(code=""){
  let h = code ? createHash(code) : Math.floor(Math.random()*999999);
  let r = (h % 100) / 100;
  let rarity = r < 0.04 ? "ssr" : (r < 0.24 ? "rare" : "common");
  let atk = 40 + (h % 15), def = 20 + (h % 10), hp = 300 + (h % 70);
  if(rarity==="rare"){ atk*=1.15; def*=1.15; hp*=1.15; }
  if(rarity==="ssr"){ atk*=1.3; def*=1.3; hp*=1.3; }
  return {
    name: (code?"バーコードモンスター":"モンスター"), rarity,
    atk:Math.floor(atk), def:Math.floor(def), hp:Math.floor(hp), maxHp:Math.floor(hp),
    tempAtk:Math.floor(atk), tempDef:Math.floor(def), status:null,
    sprite: IMAGES[rarity][h % IMAGES[rarity].length],
    skills: assignSkills(h, rarity)
  };
}

async function addChar(code=""){
  if(characters.length>=2) return;
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  let c = genCharacter(code);
  let summonText = "～　召喚　～";
  if(c.rarity==="rare") summonText = "～　上位召喚　～";
  if(c.rarity==="ssr") summonText = "✨ 　究極召喚　 ✨";
  
  showEffect(summonText + "<br>" + c.name + " が現れた", ()=>{
    characters.push(c); hpVisual.push(c.hp);
    render();
    if(characters.length==2) document.getElementById("startBattleBtn").style.display="block";
  });
}

function manualInput(){ let v=document.getElementById("barcodeInput").value; if(v) addChar(v); }
function randomGen(){ addChar(""); }
function scan(){
  if(scanner) return;
  scanner = new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"}, {fps:15, qrbox:250}, txt=>{ addChar(txt); }, err=>{})
  .catch(e=>{ alert("カメラを許可してください"); scanner=null; });
}

function render(){
  if(battleStarted){
    document.getElementById("turn").innerText = `${current==0?player1NameVal:player2NameVal} のターン`;
  }
  let html = "";
  characters.forEach((c,i)=>{
    let hpP = (hpVisual[i]/c.maxHp)*100;
    let color = hpP<30?"red":hpP<60?"orange":"lime";
    let statusMap = { paralyze:"⚡麻痺", poison:"☠️猛毒", weaken:"🩻衰弱", irradiate:"☢️被曝" };
    let statusText = c.status ? "状態：" + statusMap[c.status] : "状態：健康";
    html += `<div class="char ${c.rarity}"><img src="${c.sprite}"><br>❤️ ${Math.floor(c.hp)} / ${c.maxHp}<br><div class="hpWrap"><div class="hpNow" style="width:${hpP}%;background:${color}"></div></div><div class="status-badge">${statusText}</div></div>`;
  });
  document.getElementById("chars").innerHTML = html;
}

function showEffect(msg, cb){
  let e=document.createElement("div"); e.id="effect";
  e.innerHTML = msg + "<br><small style='color:#ccc; font-size:14px;'>クリックで進む</small>";
  e.onclick = ()=>{ e.remove(); if(cb) cb(); };
  document.body.appendChild(e);
}

function startBattle(){
  document.getElementById("setupPanel").style.display="none";
  document.getElementById("startBattleBtn").style.display="none";
  battleStarted=true; hpVisual = characters.map(c => c.hp); animateHP(); proceedTurn();
}

function showSkills(){
  let c = characters[current], html = "";
  c.skills.forEach((s,i)=>{ html += `<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`; });
  document.getElementById("skills").innerHTML = html;
}

function useSkill(i){
  if(!battleStarted || waitingForCPU) return;
  let a=characters[current], d=characters[1-current], s=a.skills[i];
  if(s.name==="奥義" && s.used) { showEffect("奥義は１回しか使えない ！！"); return; }
  if(s.name==="奥義") s.used=true;
  
  waitingForCPU = true;
  let name = current == 0 ? player1NameVal : player2NameVal;
  let msg = name + " が " + s.name + " を使った";

  if(s.miss && Math.random()<s.miss){
    msg += `<br><br><span class="dmg-text" style="color:var(--blue)">MISS !!</span>`;
    render(); showEffect(msg, () => { waitingForCPU = false; nextTurn(); }); return;
  }

  if(s.instant && Math.random()<s.instant){ d.hp = 0; msg += "<br><span style='color:purple;font-weight:bold;'>即死 ！！</span>"; }
  if(s.heal){ 
    let heal = Math.floor(a.maxHp * (0.07 + Math.random() * 0.08));
    a.hp = Math.min(a.maxHp, a.hp+heal); a.tempDef *= 1.1; msg+=`<br>${heal} の回復`; 
  }
  if(s.buffAtk){ a.tempAtk *= 1.3; msg += "<br>攻撃力アップ！！"; }
  if(s.buffDef){ a.tempDef *= 1.3; msg += "<br>防御力アップ！！"; }
  if(s.debuffAtk){ d.tempAtk *= 0.93; msg += "<br>相手の攻撃力ダウン！！"; }
  if(s.debuffDef){ d.tempDef *= 0.93; msg += "<br>相手の防御力ダウン！！"; }

  if(s.power){
    let crit = Math.random()<0.05;
    let base = (a.tempAtk - d.tempDef/2) * s.power;
    let dmg = Math.max(1, Math.floor(base * (crit?2:1)));
    if(crit) msg += `<br><br><span class="dmg-text" style="color:var(--gold); text-shadow:0 0 15px yellow;">⚡ CRITICAL !!</span>`;
    d.hp = Math.max(0, d.hp - dmg);
    msg += `<br><span class="dmg-text" style="color:var(--red)">HIT !! ${dmg} ダメージ</span>`;
  }
  
  if(s.status && !d.status && Math.random()<(s.rate||1)) d.status=s.status;

  render();
  showEffect(msg, ()=>{ if(d.hp<=0) pendingWin=name; waitingForCPU=false; nextTurn(); });
}

function nextTurn(){
  if(pendingWin){ showWin(pendingWin); return; }
  current = 1 - current;
  let c = characters[current], name = current==0?player1NameVal:player2NameVal;

  if(c.status==="paralyze"){ 
    showEffect(name + " は麻痺で動けない", ()=>{ c.status = null; nextTurn(); }); 
    return; 
  }
  if(c.status === "poison" || c.status === "weaken" || c.status === "irradiate"){
    let dmg = Math.floor(c.maxHp*0.04), color="var(--purple)", icon="☠️", effMsg="";
    if(c.status==="poison") effMsg = `${name} は 猛毒に侵されている !!<br><br><span class="dmg-text" style="color:var(--purple); text-shadow:0 0 15px #8b008b;">${icon} ${dmg} ダメージ !!</span>`;
    if(c.status==="weaken") { 
        c.tempAtk *= 0.95; c.tempDef *= 0.95;
        effMsg = `${name} は 衰弱している ...<br><br><span class="dmg-text" style="color:#9370db; text-shadow:0 0 10px #4b0082;">🩻 ${dmg} ダメージ !!</span><br>能力が低下した ！！`;
    }
    if(c.status==="irradiate") {
        dmg = Math.floor(c.maxHp*0.03); color="var(--green)"; icon="☢️"; c.tempDef *= 0.8;
        effMsg = `${name} は 被曝している ！！<br><br><span class="dmg-text" style="color:var(--green); text-shadow:0 0 10px green;">${icon} ${dmg} ダメージ !!</span><br>防御力が大幅にダウン ！！`;
    }
    c.hp = Math.max(0, c.hp-dmg);
    render();
    showEffect(effMsg, ()=>{
      if(c.hp<=0) showWin(current==0?player2NameVal:player1NameVal); else proceedTurn();
    });
    return;
  }
  proceedTurn();
}

function proceedTurn(){
  render(); showSkills();
  if(gameMode==="cpu" && current===1){
    setTimeout(()=>{ let u=characters[1].skills; useSkill(Math.floor(Math.random()*u.length)); }, 600);
  }
}

function animateHP(){
  if(animRunning) return; animRunning=true;
  function loop(){
    characters.forEach((c,i)=>{ if(hpVisual[i]!==undefined) hpVisual[i]+=(c.hp-hpVisual[i])*0.15; });
    render(); requestAnimationFrame(loop);
  }
  loop();
}

function showWin(w){
  battleStarted=false; document.getElementById("skills").innerHTML="";
  document.getElementById("rematchBtn").style.display="block";
  showEffect(`${w} の勝利！！`);
}

function rematch(){
  characters.forEach(c=>{ 
    c.hp=c.maxHp; c.status=null; c.tempAtk=c.atk; c.tempDef=c.def; 
    c.skills.forEach(s=>{if(s.name==="奥義")s.used=false;}); 
  });
  hpVisual = characters.map(c=>c.hp); pendingWin=null;
  document.getElementById("rematchBtn").style.display="none";
  startBattle();
}

async function goTitle(){
  if(confirm("進行状況を破棄してタイトルに戻りますか？")){
    if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
    characters=[]; hpVisual=[]; battleStarted=false;
    document.getElementById("game").style.display="none";
    document.getElementById("title").style.display="block";
    document.getElementById("setupPanel").style.display="block";
  }
}

function startMode(m){
  player1NameVal=document.getElementById("player1Name").value||"1P";
  player2NameVal=m==="cpu"?"CPU":(document.getElementById("player2Name").value||"2P");
  gameMode=m; document.getElementById("gameModeLabel").innerText = m.toUpperCase();
  document.getElementById("title").style.display="none"; document.getElementById("game").style.display="block";
}

function showOptions(){ document.getElementById("options").style.display="block"; }
function closeOptions(){ document.getElementById("options").style.display="none"; }
</script>
</body>
</html>
