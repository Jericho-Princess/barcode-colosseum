<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  color:white;
  background:url("img/bg.jpg") no-repeat center/cover;
}

/* ターン */
#turn{font-size:30px; margin:10px;}

/* キャラ */
.char{
  border:4px solid white;
  border-radius:15px;
  padding:10px;
  margin:10px;
}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold; box-shadow:0 0 20px gold;}

/* HP */
.hpWrap{background:#333;height:10px;position:relative;}
.hpNow{background:lime;height:10px;}
.hpLost{background:red;height:10px;position:absolute;right:0;}

/* 横 */
@media (orientation:landscape){
  #chars{display:flex;}
  .char{width:40%;}
  .char img{width:150px;}
}

/* エフェクト */
#effect{
  position:fixed;
  top:40%; left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  z-index:999;
}
</style>
</head>

<body>

<h1>🔥 バーコードコロシアム</h1>

<div id="title">
<button onclick="startPVP()">プレイヤー対戦</button>
<button onclick="showOptions()">⚙️ オプション</button>
</div>

<div id="options" style="display:none;">
<h2>設定</h2>
<input id="p1" placeholder="プレイヤー1">
<input id="p2" placeholder="プレイヤー2"><br><br>

<button onclick="toggleSound()" id="soundBtn">音声: OFF</button><br><br>

<button onclick="showSkillList()">📖 技一覧</button><br><br>

<button onclick="location.reload()">戻る</button>
</div>

<div id="game" style="display:none;">
<input id="code">
<button onclick="manual()">入力</button>
<button onclick="randomGen()">🎲</button>
<button onclick="scan()">📷</button>

<div id="reader"></div>

<h3 id="turn"></h3>
<div id="chars"></div>
<div id="skills"></div>
<h2 id="result"></h2>
</div>

<script>
let characters=[], current=0, tempCode=null;
let playerNames=["1P","2P"];
let soundEnabled=JSON.parse(localStorage.getItem("soundEnabled")||"false");

/* 音 */
const sounds={
 attack:new Audio("sound/attack.mp3"),
 miss:new Audio("sound/miss.mp3"),
 heal:new Audio("sound/heal.mp3"),
 buff:new Audio("sound/buff.mp3"),
 ultimate:new Audio("sound/ultimate.mp3")
};
function playSound(n){
 if(!soundEnabled)return;
 let s=sounds[n].cloneNode();
 s.play();
}

/* 技 */
const skillList=[
{name:"強打",power:1.8,miss:0.25},
{name:"魔法",power:1.4,miss:0.15},
{name:"毒針",power:0.5,instant:0.05},
{name:"憤怒",buff:"atk"},
{name:"鉄壁",buff:"def"},
{name:"再生",heal:0.2},
{name:"疫病",debuff:true},
{name:"特攻",power:2.2,self:0.3}
];

function assignSkills(r){
 let s=[{name:"攻撃",power:1,miss:0.05}];
 let rdm=[...skillList].sort(()=>0.5-Math.random());
 s.push(rdm[0],rdm[1]);
 if(r==="ssr") s.push({name:"奥義",power:2.8,miss:0.1});
 return s;
}

/* キャラ */
function gen(code){
 let r=Math.random()<0.7?"common":Math.random()<0.9?"rare":"ssr";
 let base=100+Math.random()*200;
 return{
  name:"モンスター",
  rarity:r,
  sprite:"img/c1.png",
  hp:base,
  maxHp:base,
  atk:20+Math.random()*50,
  def:10+Math.random()*30,
  skills:assignSkills(r)
 };
}

/* UI */
function showSummonButton(code){
 let r=Math.random()<0.1?"ssr":"normal";
 skills.innerHTML=`<button onclick="doSummon()">${r==="ssr"?"🌈究極召喚":"召喚"}</button>`;
 tempCode=code;
}

function doSummon(){
 let c=gen(tempCode);
 characters.push(c);
 render();
 if(characters.length>=2)startBattle();
}

/* バトル */
function startBattle(){
 turn();
 showSkills();
}

function showSkills(){
 let c=characters[current];
 skills.innerHTML="";
 c.skills.forEach((s,i)=>{
  skills.innerHTML+=`<button onclick="useSkill(${i})">${s.name}</button>`;
 });
}

function useSkill(i){
 let a=characters[current];
 let d=characters[1-current];
 let s=a.skills[i];

 showEffect(s);

 if(s.miss && Math.random()<s.miss){
  showText("Miss");
  playSound("miss");
  next();
  return;
 }

 let dmg=(a.atk-d.def/2)*(s.power||1);
 d.hp-=dmg;

 showText("Hit");
 playSound("attack");

 if(d.hp<0)d.hp=0;
 render();

 if(d.hp<=0){
  result.innerText="勝利";
  return;
 }

 next();
}

function next(){
 current=1-current;
 turn();
 showSkills();
}

/* 表示 */
function render(){
 let html="";
 characters.forEach(c=>{
  let hpP=c.hp/c.maxHp*100;
  html+=`
  <div class="char ${c.rarity}">
  <img src="${c.sprite}" width=80><br>
  ❤️${c.hp}
  <div class="hpWrap">
    <div class="hpNow" style="width:${hpP}%"></div>
    <div class="hpLost" style="width:${100-hpP}%"></div>
  </div>
  </div>`;
 });
 chars.innerHTML=html;
}

function turn(){
 turn.innerText=playerNames[current]+" のターン";
}

/* エフェクト */
function showEffect(s){
 let e=document.createElement("div");
 e.id="effect";
 e.innerText=s.name;
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),600);
}

function showText(t){
 let e=document.createElement("div");
 e.id="effect";
 e.innerText=t;
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),600);
}

/* 入力 */
function manual(){showSummonButton(code.value);}
function randomGen(){showSummonButton(""+Math.random());}

/* カメラ */
function scan(){
 let s=new Html5Qrcode("reader");
 s.start({facingMode:"environment"},
 {fps:10,qrbox:250},
 txt=>{
  showSummonButton(txt);
  s.stop();
 });
}

/* UI */
function startPVP(){
 title.style.display="none";
 game.style.display="block";
}

/* オプション */
function showOptions(){
 title.style.display="none";
 options.style.display="block";
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 localStorage.setItem("soundEnabled",soundEnabled);
 document.getElementById("soundBtn").innerText="音声: "+(soundEnabled?"ON":"OFF");
}

/* 技一覧 */
function showSkillList(){
 let html="<h2>技一覧</h2>";
 skillList.forEach(s=>{
  html+=`<div>${s.name}</div>`;
 });
 document.body.innerHTML=html+"<br><button onclick='location.reload()'>戻る</button>";
}
</script>

</body>
</html>
