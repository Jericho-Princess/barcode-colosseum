<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコードコロシアム</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  color:#f5f5f5;
  background:#3b2f2f; /* ダークブラウン */
  text-shadow:0 0 5px black;
}

/* UIパネル共通 */
.panel{
  background:rgba(0,0,0,0.5);
  padding:10px;
  margin:10px;
  border-radius:10px;
}

/* ターン表示 */
#turn{
  font-size:32px;
}

/* キャラクター */
.char{
  border:4px solid #999;
  border-radius:15px;
  padding:10px;
  margin:10px;
}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:gold;box-shadow:0 0 15px gold;}

/* HPバー */
.hpWrap{background:#222;height:10px;position:relative;}
.hpNow{background:lime;height:10px;}
.hpLost{background:red;height:10px;position:absolute;right:0;}

/* 横画面 */
@media (orientation:landscape){
  #chars{display:flex;}
  .char{width:40%;}
  .char img{width:140px;}
}

/* エフェクト */
#effect{
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,0);
  font-size:42px;
  z-index:999;
}

/* 技ボタン */
.skillBtn{
  margin:5px;
  padding:10px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>バーコードコロシアム</h1>

<!-- タイトル画面 -->
<div id="title" class="panel">
  <button onclick="startPVP()">プレイヤー対戦</button><br><br>
  <button onclick="startCPU()">CPU対戦</button>
</div>

<!-- ゲーム画面 -->
<div id="game" style="display:none;">
  <button id="backBtn" onclick="goTitle()">← タイトルに戻る</button><br><br>

  <div class="panel">
    <button onclick="manual()">入力召喚</button>
    <button onclick="randomGen()">ランダム召喚</button>
    <button onclick="scan()">スキャン召喚</button>
  </div>

  <div id="reader"></div>

  <div id="turn" class="panel"></div>

  <div id="chars"></div>

  <div id="skills" class="panel"></div>

  <div id="result" class="panel"></div>
</div>

<script>
let characters=[], current=0;
let gameMode="pvp";

/* 画像リスト */
const charImages = ["img/c1.png","img/c2.png","img/c3.png","img/c4.png"];

/* 技割り当て */
function assignSkills(rarity="common"){
  let skills=[{name:"攻撃", power:1, miss:0.05}];
  let skillPool = [
    {name:"強打", power:1.8, miss:0.25},
    {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, miss:0.05},
    {name:"憤怒", power:0, miss:0, buff:"atkUp"},
    {name:"鉄壁", power:0, miss:0, buff:"defUp"},
    {name:"再生", power:0, miss:0, buff:"heal"},
    {name:"疫病", power:0, miss:0, debuff:"down"},
    {name:"特攻", power:2.5, miss:0.1, recoil:true}
  ];
  skillPool.sort(()=>0.5-Math.random());
  skills.push(skillPool[0]);
  skills.push(skillPool[1]);
  if(rarity=="ssr") skills.push({name:"奥義", power:3, miss:0.2});
  return skills;
}

/* キャラクター生成 */
function gen(){
  let sprite = charImages[Math.floor(Math.random()*charImages.length)];
  let r=Math.random();
  let rarity="common";
  if(r>0.85) rarity="rare";
  if(r>0.97) rarity="ssr";
  let atk=40, def=20, hp=150;
  if(rarity=="rare"){ atk*=1.12; def*=1.12; hp*=1.12; }
  if(rarity=="ssr"){ atk*=1.3; def*=1.3; hp*=1.3; }
  return {
    name:"モンスター",
    rarity:rarity,
    sprite:sprite,
    hp:hp,
    maxHp:hp,
    atk:atk,
    def:def,
    skills:assignSkills(rarity)
  };
}

/* 召喚 */
function manual(){addChar();}
function randomGen(){addChar();}
function scan(){
  let s=new Html5Qrcode("reader");
  s.start({facingMode:"environment"},{fps:10,qrbox:250},
    txt=>{
      addChar();
      s.stop();
  });
}

function addChar(){
  if(characters.length >=2){
    alert("キャラクターは最大2体までです");
    return;
  }
  characters.push(gen());
  render();
  if(characters.length>=2) startBattle();
}

/* 戦闘開始 */
function startBattle(){
  current=0;
  updateTurn();
  showSkills();
}

/* ターン更新 */
function updateTurn(){
  turn.innerText=(current==0?"1P":"2P")+" のターン";
}

/* 技表示 */
function showSkills(){
  let c=characters[current];
  let html="";
  c.skills.forEach((s,i)=>{
    html+=`<button class="skillBtn" onclick="useSkill(${i})">${s.name}</button>`;
  });
  skills.innerHTML=html;
}

/* 技使用 */
function useSkill(i){
  let a=characters[current];
  let d=characters[1-current];
  let s=a.skills[i];

  showSkillName(s.name);

  if(Math.random()<s.miss){
    showResult("Miss");
    next();
    return;
  }

  let dmg=(a.atk-d.def/2)*s.power;
  d.hp -= dmg;
  if(d.hp<0)d.hp=0;

  showResult("Hit");
  render();

  if(d.hp<=0){
    result.innerHTML = (current==0?"1P":"2P") + " 勝利！<br>" +
                       '<button onclick="rematch()">再戦</button>';
    return;
  }

  next();
}

/* 次のターン */
function next(){
  current=1-current;
  updateTurn();
  showSkills();

  if(gameMode=="cpu" && current==1){
    setTimeout(()=>{
      let r=Math.floor(Math.random()*characters[1].skills.length);
      useSkill(r);
    },600);
  }
}

/* キャラクター描画 */
function render(){
  let html="";
  characters.forEach(c=>{
    let hpP=c.hp/c.maxHp*100;
    html+=`
    <div class="char ${c.rarity}">
      <img src="${c.sprite}" width=80><br>
      ❤️ ${Math.floor(c.hp)} / ${Math.floor(c.maxHp)}<br>
      ⚔️ ${Math.floor(c.atk)}<br>
      🛡 ${Math.floor(c.def)}<br>
      <div class="hpWrap">
        <div class="hpNow" style="width:${hpP}%"></div>
        <div class="hpLost" style="width:${100-hpP}%"></div>
      </div>
    </div>`;
  });
  chars.innerHTML = html;
}

/* 技名表示 */
function showSkillName(name){
  let e=document.createElement("div");
  e.id="effect";
  e.innerText=name;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),500);
}

/* Hit/Miss 表示 */
function showResult(text){
  let e=document.createElement("div");
  e.id="effect";
  e.style.top="50%";
  e.innerText=text;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),500);
}

/* タイトルに戻る */
function goTitle(){
  game.style.display="none";
  title.style.display="block";
  characters=[];
  current=0;
  result.innerText="";
  chars.innerHTML="";
  skills.innerHTML="";
}

/* 再戦 */
function rematch(){
  characters.forEach(c=>{
    c.hp = c.maxHp;
    c.skills = assignSkills(c.rarity);
  });
  current=0;
  result.innerText="";
  render();
  updateTurn();
  showSkills();

  if(gameMode=="cpu" && characters.length==2 && current==1){
    setTimeout(()=>{
      let r=Math.floor(characters[1].skills.length);
      useSkill(r);
    },600);
  }
}

/* モード切替 */
function startPVP(){
  gameMode="pvp";
  title.style.display="none";
  game.style.display="block";
}

function startCPU(){
  gameMode="cpu";
  title.style.display="none";
  game.style.display="block";
}
</script>

</body>
</html>
