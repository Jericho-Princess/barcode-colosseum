<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バーコードコロシアム 究極版</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root { --purple: #bf00ff; --green: #7cfc00; --red: #ff4d4d; --gold: #ffd700; }
body{font-family:sans-serif;margin:0;padding:0;background:#2b2323;color:#f5f5f5;text-align:center;overflow-x:hidden;}
.panel{background:rgba(0,0,0,0.6);padding:10px;margin:8px;border-radius:12px;border:1px solid #444;}
#turn{font-size:24px;margin:5px 0;font-weight:bold;color:var(--gold);min-height:30px;}

/* レイアウト */
#chars { display: flex; justify-content: center; gap: 8px; margin-top:10px;}
.char{border:4px solid #999;border-radius:12px;padding:5px;width:45%;max-width:160px;background:rgba(0,0,0,0.4);box-sizing:border-box;}
.common{border-color:#cd7f32;}
.rare{border-color:silver;}
.ssr{border-color:var(--gold);box-shadow:0 0 15px var(--gold);}
.char img{width:100%;height:auto;image-rendering:pixelated;margin-bottom:5px;}

.hpWrap{background:#222;height:14px;border-radius:7px;overflow:hidden;margin:5px 0;}
.hpNow{background:lime;height:100%;transition:width 0.3s ease;}
.status-badge{font-size:12px;background:#444;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:2px;}

/* 演出ポップアップ */
#effect {
  position: fixed; top: 55%; left: 50%; transform: translate(-50%, -50%);
  width: 88%; max-width: 420px; background: rgba(0,0,0,0.95);
  padding: 20px; border-radius: 20px; border: 2px solid #888;
  z-index: 3000; font-size: 20px; box-shadow: 0 0 30px black;
}
.dmg-text { font-size: 28px; font-weight: bold; display: block; margin: 10px 0; text-shadow: 0 0 10px black; }

/* ボタン類 */
button{font-size:16px;padding:12px 16px;margin:4px;border-radius:8px;background:#444;color:white;border:none;cursor:pointer;box-shadow:0 4px #111;}
button:active{transform:translateY(2px);box-shadow:0 2px #111;}
.skillBtn{width:46%; background: #556; font-weight:bold;}
#startBattleBtn{background: linear-gradient(to bottom, #ff8c00, #ff4500); width:90%; font-size:20px; margin:15px auto;}

/* ヘッダー/メニュー */
.header-nav { display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(0,0,0,0.3); }

/* オプション・技一覧 */
#options { position: fixed; top:0; left:0; width:100%; height:100%; background:#2b2323; z-index:4000; overflow-y:auto; padding:20px; box-sizing:border-box; display:none;}
table { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 10px; }
table th, table td { border-bottom: 1px solid #555; padding: 8px 4px; text-align: left; }
</style>
</head>
<body>

<div id="title">
  <div class="panel">
    <img src="img/logo.png" style="width:280px; max-width:80%; margin:20px 0;"><br>
    <button onclick="startMode('pvp')" style="background:#0066cc; width:80%;">プレイヤー対戦</button><br>
    <button onclick="startMode('cpu')" style="background:#cc3300; width:80%;">CPU対戦</button><br>
    <button onclick="showOptions()" style="background:#555; width:80%;">オプション・技一覧</button>
  </div>
</div>

<div id="options">
  <h2>設定・技ガイド</h2>
  <div class="panel">
    1P名: <input id="player1Name" placeholder="1P" style="padding:8px; width:100px;">
    2P名: <input id="player2Name" placeholder="2P" style="padding:8px; width:100px;">
  </div>

  <h3>技一覧</h3>
  <table>
    <tr><th>技名</th><th>効果</th></tr>
    <tr><td>攻撃</td><td>通常ダメージ</td></tr>
    <tr><td>強打</td><td>高威力(30%でミス)</td></tr>
    <tr><td>毒液</td><td>ダメージ＋70%で【猛毒】</td></tr>
    <tr><td>呪詛</td><td>100%で【衰弱】</td></tr>
    <tr><td>汚染</td><td>ダメージ＋30%で【被曝】</td></tr>
    <tr><td>再生</td><td>HP回復＋防御力アップ</td></tr>
    <tr><td>奥義</td><td>SSR専用：超絶ダメージ(1回)</td></tr>
  </table>
  
  <h3 style="margin-top:20px;">状態異常</h3>
  <div style="text-align:left; font-size:14px; padding:0 10px;">
    <p>⚡<b>麻痺:</b> 行動不能（次ターン解除）</p>
    <p>☠<b>猛毒:</b> 毎ターン最大HPの4%ダメージ</p>
    <p>🩻<b>衰弱:</b> ダメ＋攻撃・防御が徐々に低下</p>
    <p>☢<b>被曝:</b> ダメ＋防御力が大幅に低下</p>
  </div>
  <button onclick="closeOptions()" style="width:100%; background:#777; margin-top:20px;">閉じる</button>
</div>

<div id="game" style="display:none;">
  <div class="header-nav">
    <button onclick="goTitle()" style="padding:5px 10px; font-size:12px; background:#8b0000;">🏠 タイトルへ</button>
    <div id="gameModeLabel" style="font-size:12px; color:#aaa; line-height:30px;">PVP MODE</div>
  </div>

  <div id="setupPanel" class="panel">
    <div style="margin-bottom:10px;">
      <input id="barcodeInput" placeholder="バーコード数字" style="width:120px; padding:10px; border-radius:5px; border:none;">
      <button onclick="manualInput()" style="background:#444;">召喚</button>
    </div>
    <button onclick="randomGen()" style="background:#2e8b57;">ランダム召喚</button>
    <button onclick="scan()" style="background:#483d8b;">スキャン</button>
    <button onclick="resetChars()" style="background:#555;">リセット</button>
  </div>
  
  <div id="reader"></div>

  <div id="battleArea">
    <div id="turn"></div>
    <div id="chars"></div>
    <div id="skills" class="panel" style="min-height:100px;"></div>
    <button id="startBattleBtn" style="display:none;" onclick="startBattle()">バトル開始！！</button>
    <button id="rematchBtn" style="display:none; background:#2e8b57; width:90%;" onclick="rematch()">もう一度対戦</button>
  </div>
</div>

<script>
// --- 基本変数 ---
let characters=[], current=0, gameMode="pvp";
let player1NameVal="1P", player2NameVal="2P";
let battleStarted=false, waitingForCPU=false;
let pendingWin = null, hpVisual = [], animRunning = false, scanner = null;

const IMAGES={
  common:Array.from({length:12},(_,i)=>`img/c${i+1}.png`),
  rare:Array.from({length:5},(_,i)=>`img/r${i+1}.png`),
  ssr:Array.from({length:3},(_,i)=>`img/s${i+1}.png`)
};

// --- ハッシュ・生成ロジック ---
function createHash(code){
  let h = 0;
  for(let i=0;i<code.length;i++){ h = (h << 5) - h + code.charCodeAt(i); h |= 0; }
  h ^= (h << 13); h ^= (h >> 17); h ^= (h << 5);
  return (h * 2654435761) >>> 0;
}

function assignSkills(hash, rarity){
  let pool = [
    {name:"強打", power:1.8, miss:0.30}, {name:"魔法", power:1.4, miss:0.15},
    {name:"毒針", power:0.5, instant:0.05}, {name:"憤怒", buffAtk:1.3},
    {name:"鉄壁", buffDef:1.3}, {name:"再生", heal:0.1, buffDef:1.1},
    {name:"疫病", debuffAtk:0.93, debuffDef:0.93}, {name:"電撃", power:1.2, status:"paralyze", rate:0.3, miss:0.15},
    {name:"毒液", power:0.3, status:"poison", rate:0.7, miss:0.15},
    {name:"呪詛", status:"weaken"}, {name:"汚染", power:0.3, status:"irradiate", rate:0.3, miss:0.15}
  ];
  let s = [{name:"攻撃", power:1.0}];
  let i1 = hash % pool.length;
  let i2 = (hash + 7) % pool.length;
  if(i1===i2) i2 = (i2 + 1) % pool.length;
  s.push(pool[i1], pool[i2]);
  if(rarity==="ssr") s.push({name:"奥義", power:3.2, used:false});
  return s;
}

function genCharacter(code=""){
  let h = code ? createHash(code) : Math.floor(Math.random()*9999999);
  let r = (h % 100) / 100;
  let rarity = r < 0.04 ? "ssr" : (r < 0.24 ? "rare" : "common");
  let atk = 40 + (h % 15), def = 20 + (h % 10), hp = 300 + (h % 70);
  if(rarity==="rare"){ atk*=1.2; def*=1.2; hp*=1.2; }
  if(rarity==="ssr"){ atk*=1.4; def*=1.4; hp*=1.4; }
  return {
    name: "モンスタ" + (h%999), rarity,
    atk:Math.floor(atk), def:Math.floor(def), hp:Math.floor(hp), maxHp:Math.floor(hp),
    tempAtk:Math.floor(atk), tempDef:Math.floor(def), status:null,
    sprite: IMAGES[rarity][h % IMAGES[rarity].length],
    skills: assignSkills(h, rarity)
  };
}

// --- システム ---
async function addChar(code=""){
  if(characters.length>=2) return;
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  let c = genCharacter(code);
  characters.push(c); hpVisual.push(c.hp);
  render();
  let prefix = c.rarity==="ssr"?"【究極】": (c.rarity==="rare"?"【上位】":"");
  showEffect(prefix + c.name + " 召喚！");
  if(characters.length==2) document.getElementById("startBattleBtn").style.display="block";
}

function manualInput(){ let v=document.getElementById("barcodeInput").value; if(v) { addChar(v); document.getElementById("barcodeInput").value=""; } }
function randomGen(){ addChar(""); }
function scan(){
  if(scanner) return;
  scanner = new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"}, {fps:15, qrbox:250}, txt=>{ addChar(txt); }, err=>{})
  .catch(e=>{ alert("カメラを許可してください"); scanner=null; });
}

function render(){
  document.getElementById("turn").innerText = battleStarted ? `${current==0?player1NameVal:player2NameVal} の番` : "";
  let html = "";
  characters.forEach((c,i)=>{
    let hpP = (hpVisual[i]/c.maxHp)*100;
    let color = hpP<30?"red":hpP<60?"orange":"lime";
    let statusLabel = c.status ? `<div class="status-badge">${c.status}</div>` : "";
    html += `<div class="char ${c.rarity}"><img src="${c.sprite}"><div class="hpWrap"><div class="hpNow" style="width:${hpP}%;background:${color}"></div></div><div style="font-size:13px">❤️ ${Math.floor(c.hp)}</div>${statusLabel}</div>`;
  });
  document.getElementById("chars").innerHTML = html;
}

function showEffect(msg, cb){
  let e=document.createElement("div"); e.id="effect";
  e.innerHTML = msg + "<br><small style='color:#777; font-size:12px;'>- Tap to Continue -</small>";
  e.onclick = ()=>{ e.remove(); if(cb) cb(); };
  document.body.appendChild(e);
}

// --- バトル ---
function startBattle(){
  document.getElementById("setupPanel").style.display="none";
  document.getElementById("startBattleBtn").style.display="none";
  battleStarted=true; animateHP(); proceedTurn();
}

function showSkills(){
  let c = characters[current], html = "";
  c.skills.forEach((s,i)=>{
    let style = s.name==="奥義"?"background:linear-gradient(to bottom, #ffd700, #b8860b); color:black;":"";
    html += `<button class="skillBtn" style="${style}" onclick="useSkill(${i})">${s.name}</button>`;
  });
  document.getElementById("skills").innerHTML = html;
}

function useSkill(i){
  if(!battleStarted || waitingForCPU) return;
  let a=characters[current], d=characters[1-current], s=a.skills[i];
  if(s.name==="奥義" && s.used) return;
  if(s.name==="奥義") s.used=true;
  
  waitingForCPU = true;
  let msg = `<span style="color:var(--gold)">${a.name} の ${s.name}！</span>`;

  if(s.miss && Math.random()<s.miss){
    msg += `<span class="dmg-text" style="color:#4da6ff">MISS !!</span>`;
  } else {
    if(s.power){
      let crit = Math.random()<0.05;
      let dmg = Math.max(1, Math.floor(((a.tempAtk-d.tempDef/2)*s.power)*(crit?2:1)));
      d.hp = Math.max(0, d.hp - dmg);
      if(crit) msg += `<span class="dmg-text" style="color:var(--gold)">⚡ CRITICAL !!</span>`;
      msg += `<span class="dmg-text" style="color:var(--red)">HIT !! ${dmg} ダメージ</span>`;
    }
    if(s.heal){ let h=Math.floor(a.maxHp*0.1); a.hp=Math.min(a.maxHp, a.hp+h); a.tempDef*=1.1; msg+=`<br>回復 ＆ 防御力UP！`; }
    if(s.status && !d.status && Math.random()<(s.rate||1)) {
        d.status=s.status;
        msg += `<br>相手を【${s.status}】にした！`;
    }
    if(s.buffAtk){ a.tempAtk*=1.3; msg+=`<br>攻撃力が大幅に上がった！`; }
    if(s.debuffAtk){ d.tempAtk*=0.9; d.tempDef*=0.9; msg+=`<br>相手の能力を下げた！`; }
  }

  render();
  showEffect(msg, ()=>{ if(d.hp<=0) pendingWin=current==0?player1NameVal:player2NameVal; waitingForCPU=false; nextTurn(); });
}

function nextTurn(){
  if(pendingWin){ showWin(pendingWin); return; }
  current = 1 - current;
  let c = characters[current], name = current==0?player1NameVal:player2NameVal;

  if(c.status==="paralyze"){ 
    showEffect(name+" は麻痺で動けない！", ()=>{ c.status=null; nextTurn(); }); 
    return; 
  }
  if(c.status === "poison" || c.status === "weaken" || c.status === "irradiate"){
    let dmg = Math.floor(c.maxHp*0.04), color="var(--purple)", icon="☠️", text="猛毒";
    if(c.status==="irradiate"){ color="var(--green)"; icon="☢️"; dmg=Math.floor(c.maxHp*0.03); text="被曝"; c.tempDef*=0.8; }
    if(c.status==="weaken"){ color="#9370db"; icon="🩻"; text="衰弱"; c.tempAtk*=0.95; c.tempDef*=0.95;}
    
    c.hp = Math.max(0, c.hp-dmg);
    render();
    showEffect(`${name} は ${text} 状態！<span class="dmg-text" style="color:${color}">${icon} ${dmg} ダメージ</span>`, ()=>{
      if(c.hp<=0) showWin(current==0?player2NameVal:player1NameVal); else proceedTurn();
    });
    return;
  }
  proceedTurn();
}

function proceedTurn(){
  render(); showSkills();
  if(gameMode==="cpu" && current===1){
    setTimeout(()=>{ 
        let usable = characters[1].skills.filter(s=>!(s.name==="奥義"&&s.used));
        useSkill(characters[1].skills.indexOf(usable[Math.floor(Math.random()*usable.length)])); 
    }, 800);
  }
}

function animateHP(){
  if(animRunning) return; animRunning=true;
  function loop(){
    characters.forEach((c,i)=>{ if(hpVisual[i]!==undefined) hpVisual[i]+=(c.hp-hpVisual[i])*0.1; });
    render(); requestAnimationFrame(loop);
  }
  loop();
}

function showWin(w){
  battleStarted=false; document.getElementById("skills").innerHTML="";
  document.getElementById("rematchBtn").style.display="block";
  showEffect("<span class='dmg-text' style='color:var(--gold)'>🎉 "+w+" の勝利！！</span>");
}

function rematch(){
  characters.forEach(c=>{ c.hp=c.maxHp; c.status=null; c.tempAtk=c.atk; c.tempDef=c.def; c.skills.forEach(s=>{if(s.name==="奥義")s.used=false;}); });
  hpVisual = characters.map(c=>c.hp); pendingWin=null;
  document.getElementById("rematchBtn").style.display="none";
  startBattle();
}

// --- ナビゲーション ---
async function resetChars(){
  if(scanner){ await scanner.stop().catch(()=>{}); scanner.clear(); scanner=null; }
  characters=[]; hpVisual=[]; battleStarted=false; pendingWin=null;
  document.getElementById("chars").innerHTML=""; document.getElementById("skills").innerHTML="";
  document.getElementById("startBattleBtn").style.display="none";
  document.getElementById("rematchBtn").style.display="none";
  render();
}

async function goTitle(){
  if(confirm("進行中のデータは消えます。タイトルに戻りますか？")){
    await resetChars();
    document.getElementById("game").style.display="none";
    document.getElementById("title").style.display="block";
    document.getElementById("setupPanel").style.display="block";
  }
}

function startMode(m){
  player1NameVal=document.getElementById("player1Name").value||"1P";
  player2NameVal=m==="cpu"?"CPU":(document.getElementById("player2Name").value||"2P");
  gameMode=m;
  document.getElementById("gameModeLabel").innerText = m.toUpperCase() + " MODE";
  document.getElementById("title").style.display="none";
  document.getElementById("game").style.display="block";
}

function showOptions(){ document.getElementById("options").style.display="block"; }
function closeOptions(){ document.getElementById("options").style.display="none"; }
</script>
</body>
</html>
